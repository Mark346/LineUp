/* ===================== KNVB-standaard per leeftijd ===================== */
// Bron: KNVB-richtlijnen speelvormen en speeltijden (O7 t/m O19, senioren)
const KNVB = [
  {max:7,  fp:4,  min:40, t:'4 tegen 4 · 8×5 min'},
  {max:9,  fp:6,  min:40, t:'6 tegen 6 · 2×20 min'},
  {max:10, fp:6,  min:50, t:'6 tegen 6 · 2×25 min'},
  {max:12, fp:8,  min:60, t:'8 tegen 8 · 2×30 min'},
  {max:13, fp:11, min:60, t:'11 tegen 11 · 2×30 min'},
  {max:15, fp:11, min:70, t:'11 tegen 11 · 2×35 min'},
  {max:17, fp:11, min:80, t:'11 tegen 11 · 2×40 min'},
  {max:99, fp:11, min:90, t:'11 tegen 11 · 2×45 min'}
];
function knvbFor(name){
  const r = String(name || '').match(/(?:^|[^a-z])(?:j|m|v)?o\s*-?\s*(\d{1,2})(?!\d)/i);
  const age = r ? +r[1] : null;
  const row = KNVB.find(k => (age || 99) <= k.max);
  return {...row, age, label: age ? `O${age}` : 'senioren'};
}
function applyKnvb(se, name){
  const k = knvbFor(name);
  const fpChanged = se.fieldPlayers !== k.fp;
  se.fieldPlayers = k.fp; se.matchMinutes = k.min;
  if (fpChanged || !FORMATIONS[k.fp].some(f => f.n === se.formation)) se.formation = FORMATIONS[k.fp][0].n;
  if (fpChanged) se.subMoments = k.fp >= 11 ? 1 : 3;
  return k;
}
const knvbMatches = (se, name) => { const k = knvbFor(name); return se.fieldPlayers === k.fp && se.matchMinutes === k.min; };

/* ===================== Voorkeursposities ===================== */
const POS_NAMES = {K:'Keeper', LB:'Linksback', LV:'Linksachter', CV:'Centrale verdediger', RV:'Rechtsachter', RB:'Rechtsback', VM:'Verdedigende middenvelder', LM:'Linkermiddenveld', CM:'Centraal middenveld', AM:'Aanvallende middenvelder', RM:'Rechtermiddenveld', LA:'Linksbuiten', LS:'Linkerspits', SP:'Spits', RS:'Rechterspits', RA:'Rechtsbuiten'};
const POS_ORDER = ['K','LB','LV','CV','RV','RB','VM','LM','CM','RM','AM','LA','LS','SP','RS','RA'];
const lineOf = c => c === 'K' ? 'K' : /^(CV|LV|RV|LB|RB)$/.test(c) ? 'V' : /^(LM|CM|RM|VM|AM)$/.test(c) ? 'M' : 'A';
const usePos = () => !!season().usePositions;
const posCodes = st => POS_ORDER.filter(c => positions(st.fieldPlayers, st.formation).some(p => p.code === c));
const prefsOf = p => ((p && p.pos) || []).filter(Boolean);
function prefScore(p, P){
  const prefs = (p && p.pos) || [];
  let sc = 0;
  prefs.forEach((c, k) => { if (!c) return; if (c === P.code) sc = Math.max(sc, [30, 20, 10][k]); else if (lineOf(c) === P.line) sc = Math.max(sc, [6, 4, 2][k]); });
  if (P.line === 'K' && prefs.some(Boolean) && !prefs.includes('K')) sc -= 50;
  if (P.line !== 'K' && prefs[0] === 'K' && prefs.filter(Boolean).length === 1) sc -= 5;
  return sc;
}
const canKeep = id => prefsOf(player(id)).includes('K');
const prefTag = p => usePos() && prefsOf(p).length ? `<small class="pp">${prefsOf(p).map(c => c === 'K' ? '🧤' : c).join(' · ')}</small>` : '';

/* ===================== Wisselmomenten per wedstrijd ===================== */
function periodName(k, base){ if (base === 2) return `${k + 1}e helft`; if (base === 4) return `${k + 1}e kwart`; return k === 0 ? 'Start' : `${k}e wissel`; }
function blockLabel(m, s){
  const st = m.settings, times = segTimes(st), base = st.base || times.length;
  if (base !== 2 && base !== 4) return s === 0 ? 'Start' : `${s}e wissel`;
  const plen = st.matchMinutes / base, start = times[s][0];
  const k = Math.min(base - 1, Math.floor((start + 0.001) / plen));
  return start === Math.round(k * plen) ? periodName(k, base) : `${periodName(k, base)} · wissel ${start}'`;
}
function blocksText(n){ return n === 2 ? '2 helften' : n === 4 ? '4 kwarten' : `${n} blokken`; }
function addSubMoment(m, min, s, pairs){
  const times = segTimes(m.settings);
  if (!m.settings.base) m.settings.base = m.cutsLocked ? null : times.length;
  m.settings.cuts = [...times.slice(1).map(t => t[0]), min].sort((a, b) => a - b);
  m.settings.subMoments++;
  const lu = m.segments[s].slice();
  pairs.forEach(p => {
    if (p.out){ const i = lu.indexOf(p.out); if (i >= 0) lu[i] = p.in || null; }
    else if (p.in){ const i = lu.indexOf(null); if (i >= 0) lu[i] = p.in; }
  });
  m.segments.splice(s + 1, 0, lu);
  if (m.out) Object.keys(m.out).forEach(id => { if (m.out[id] > s) m.out[id]++; });
  if (m.phase === 'live' && (m.cur || 0) >= s) m.cur = (m.cur || 0) + 1;
  m.cutsLocked = true; m.edited = true; ui.seg = s + 1; ui.sel = null;
}
function removeSubMoment(m, s){
  const times = segTimes(m.settings);
  if (!m.settings.base) m.settings.base = m.cutsLocked ? null : times.length;
  m.settings.cuts = times.slice(1).map(t => t[0]).filter(c => c !== times[s][0]);
  m.settings.subMoments--;
  m.segments.splice(s, 1);
  if (m.out) Object.keys(m.out).forEach(id => { if (m.out[id] > s) m.out[id]--; });
  if (m.phase === 'live' && (m.cur || 0) >= s) m.cur = Math.max(0, (m.cur || 0) - 1);
  m.cutsLocked = true; m.edited = true; ui.seg = Math.max(0, s - 1); ui.sel = null;
}
// Dialoog: minuut + wie eruit / wie erin (alleen logische keuzes)
function subDialog(m, defMin){
  return new Promise(res => {
    const times = segTimes(m.settings);
    const blockOf = min => times.findIndex(t => min > t[0] && min < t[1]);
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = iconize(`<div class="box"><p>🔁 Wisselmoment toevoegen</p>
      <label class="f">Op welke minuut?<input type="number" inputmode="numeric" id="sdMin" value="${defMin}" style="font-size:22px;text-align:center"></label>
      <div class="muted" id="sdInfo" style="margin-bottom:8px"></div>
      <div id="sdRows"></div>
      <button class="btn sm" id="sdAdd" style="margin-top:8px">＋ Nog een wissel</button>
      <div class="grid2" style="margin-top:14px"><button class="btn" data-r="no">Annuleren</button><button class="btn pri" data-r="ok">Toevoegen</button></div></div>`);
    document.body.appendChild(d);
    let pairs = [{out:'', in:''}], lastS = blockOf(defMin);
    const minVal = () => parseInt(d.querySelector('#sdMin').value);
    const draw = () => {
      const s = blockOf(minVal()), info = d.querySelector('#sdInfo'), rows = d.querySelector('#sdRows');
      d.querySelector('#sdAdd').style.display = s < 0 ? 'none' : '';
      if (s < 0){ info.innerHTML = `<span style="color:var(--acc)">Kies een minuut tussen 1 en ${m.settings.matchMinutes - 1} waarop nog geen wisselmoment is.</span>`; rows.innerHTML = ''; return; }
      info.textContent = `Valt in ${blockLabel(m, s)} (${times[s][0]}'–${times[s][1]}'). Kies wie eruit gaat en wie erin komt.`;
      const field = m.segments[s].filter(Boolean), bench = benchIds(m, s);
      rows.innerHTML = iconize(pairs.map((p, i) => {
        const outs = field.filter(id => id === p.out || !pairs.some(q => q.out === id));
        const ins = bench.filter(id => id === p.in || !pairs.some(q => q.in === id));
        return `<div class="subrow">
          <select data-i="${i}" data-k="out"><option value="">⬇️ Eruit…</option>${outs.map(id => `<option value="${id}" ${id === p.out ? 'selected' : ''}>${esc(pname(id))}</option>`).join('')}</select>
          <b>⇄</b>
          <select data-i="${i}" data-k="in"><option value="">⬆️ Erin…</option>${ins.map(id => `<option value="${id}" ${id === p.in ? 'selected' : ''}>${esc(pname(id))}</option>`).join('')}</select>
        </div>`;
      }).join('') + (bench.length ? '' : '<div class="muted">Er zitten geen reserves op de bank.</div>'));
    };
    d.querySelector('#sdMin').addEventListener('input', () => { const s = blockOf(minVal()); if (s !== lastS){ pairs = [{out:'', in:''}]; lastS = s; } draw(); });
    d.addEventListener('change', e => { e.stopPropagation(); const sel = e.target.closest('select[data-i]'); if (!sel) return; pairs[+sel.dataset.i][sel.dataset.k] = sel.value; draw(); });
    d.addEventListener('click', e => {
      e.stopPropagation();
      if (e.target.id === 'sdAdd'){ pairs.push({out:'', in:''}); draw(); return; }
      const b = e.target.closest('[data-r]');
      if (b && b.dataset.r === 'ok'){ const min = minVal(), s = blockOf(min); if (s < 0) return; d.remove(); res({min, s, pairs: pairs.filter(p => p.out || p.in)}); }
      else if (b || e.target === d){ d.remove(); res(null); }
    });
    draw();
  });
}

/* ===================== Online samenwerken (Firebase) ===================== */
const DATA_VERSION = 5;               // ophogen als de opbouw van de gegevens verandert
const FIREBASE_SDK = '10.12.2';
const CLOUD_KEY = 'opstellingmaker.cloud';
const DEVICE = (() => { let d = localStorage.getItem('opstellingmaker.device'); if (!d){ d = uid() + uid(); try { localStorage.setItem('opstellingmaker.device', d); } catch(e){} } return d; })();
const cloud = {api:null, id:null, code:'', status:'off', timer:null, lastPush:0, lastRemote:0, outdated:false, pending:null, unsub:null, force:false};
const cloudCfg = () => { try { return JSON.parse(localStorage.getItem(CLOUD_KEY)) || null; } catch(e){ return null; } };
const cloudAvailable = () => !!(window.__cloudApi || window.FIREBASE_CONFIG);
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
let fbApiPromise = null;
function firebaseApi(){
  if (window.__cloudApi) return Promise.resolve(window.__cloudApi);
  if (!window.FIREBASE_CONFIG) return Promise.resolve(null);
  if (fbApiPromise) return fbApiPromise;
  fbApiPromise = (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
    const [{initializeApp}, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
    const db = fs.getFirestore(initializeApp(window.FIREBASE_CONFIG));
    const ref = id => fs.doc(db, 'clubs', id);
    return {
      get: async id => { const s = await fs.getDoc(ref(id)); return s.exists() ? s.data() : null; },
      set: (id, v) => fs.setDoc(ref(id), v),
      listen: (id, cb, err) => fs.onSnapshot(ref(id), s => cb(s.exists() ? s.data() : null), err)
    };
  })();
  fbApiPromise.catch(() => fbApiPromise = null);
  return fbApiPromise;
}
function setCloudStatus(st){
  cloud.status = st;
  const el = document.getElementById('cloudDot');
  if (el){ el.innerHTML = iconize({ok:'☁️ ✓', busy:'☁️ …', err:'☁️ ⚠️', old:'⬆️ ververs', off:''}[st] || ''); el.className = 'cloud ' + st; }
}
async function cloudStart(){
  const c = cloudCfg();
  if (!c || !cloudAvailable()){ setCloudStatus('off'); return; }
  try {
    cloud.api = await firebaseApi();
    if (!cloud.api){ setCloudStatus('off'); return; }
    cloud.id = c.id; cloud.code = c.code;
    if (cloud.unsub) cloud.unsub();
    setCloudStatus('busy');
    cloud.unsub = cloud.api.listen(cloud.id, applyRemote, e => { console.error(e); setCloudStatus('err'); });
  } catch(e){ console.error(e); setCloudStatus('err'); }
}
function applyRemote(r){
  if (!r){ cloudPush(true); return; }                       // nog leeg: gegevens van dit apparaat uploaden
  if ((r.version || 0) > DATA_VERSION){ cloud.outdated = true; setCloudStatus('old'); showOutdated(); return; }
  if (!cloud.force){
    if (r.by === DEVICE){ if (!cloud.timer) setCloudStatus('ok'); return; } // eigen wijziging
    if (cloud.timer) return;                                 // eigen wijziging onderweg: die wint
    if (r.updated <= cloud.lastRemote) return;
  }
  cloud.force = false;
  cloud.lastRemote = r.updated || 0;
  let d; try { d = JSON.parse(r.data); } catch(e){ return; }
  const apply = () => {
    d.active = S.active;                                     // welk team je bekijkt blijft per apparaat
    S = d; normalize();
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    render(); setCloudStatus('ok');
  };
  const a = document.activeElement;
  if ((a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || drag.el || document.querySelector('.modal')) cloud.pending = apply;
  else apply();
}
function flushPending(){ if (cloud.pending && !drag.el && !document.querySelector('.modal')){ const f = cloud.pending; cloud.pending = null; f(); } }
document.addEventListener('focusout', () => setTimeout(flushPending, 50));
function cloudPush(now){
  if (!cloud.api || !cloud.id || cloud.outdated) return;
  clearTimeout(cloud.timer); setCloudStatus('busy');
  cloud.timer = setTimeout(async () => {
    const t = Date.now(); cloud.lastPush = t;
    const payload = {data: JSON.stringify({...S, active:null}), version: DATA_VERSION, updated: t, by: DEVICE};
    cloud.timer = null;
    try { await cloud.api.set(cloud.id, payload); if (!cloud.timer) setCloudStatus('ok'); }
    catch(e){ console.error(e); setCloudStatus('err'); }
  }, now ? 0 : 700);
}
function showOutdated(){
  if (document.getElementById('outdated')) return;
  const d = document.createElement('div'); d.id = 'outdated';
  d.innerHTML = iconize('⬆️ Er is een nieuwere versie van de app. Tik hier om te verversen.');
  d.onclick = () => location.reload();
  document.body.appendChild(d);
}
function cloudCard(){
  const c = cloudCfg();
  if (!cloudAvailable()) return `
  <div class="card">
    <h2>☁️ Samenwerken met andere trainers</h2>
    <div class="muted">Nog niet ingesteld. Maak een (gratis) Firebase-project aan en zet je gegevens in <b>firebase-config.js</b> in je GitHub-repo. Zie de handleiding <b>FIREBASE.md</b>.</div>
    <div class="diag">🔍 ${window.__cfgMissing ? '<b>firebase-config.js is niet gevonden.</b> Staat het bestand in dezelfde map als index.html, met precies deze naam (kleine letters)?'
      : window.__cfgError ? '<b>firebase-config.js bevat een fout:</b> ' + esc(window.__cfgError) + '. Controleer of je alleen het deel tussen { } hebt geplakt, met alle komma\'s en aanhalingstekens.'
      : '<b>firebase-config.js is gevonden, maar er staat nog geen koppeling in</b> (nog <code>null</code>?). Of je ziet nog de oude versie: wacht een minuut en ververs.'}</div>
  </div>`;
  if (c) return `
  <div class="card">
    <h2>☁️ Samenwerken</h2>
    <div class="set"><div class="lbl">Teamcode<small>${esc(c.code)}</small></div><b class="cloud ${cloud.status}">${{ok:'✓ Opgeslagen', busy:'… Bezig', err:'⚠️ Geen verbinding', old:'⬆️ Ververs de app', off:'—'}[cloud.status]}</b></div>
    <div class="muted" style="margin:8px 0">Alles wordt automatisch online bewaard. Andere trainers openen dezelfde app en vullen dezelfde teamcode en pincode in.</div>
    <button class="btn full" data-act="cloudOff">Loskoppelen op dit apparaat</button>
  </div>`;
  return `
  <div class="card">
    <h2>☁️ Samenwerken</h2>
    <div class="muted" style="margin-bottom:10px">Vul een teamcode en pincode in. Iedereen die dezelfde combinatie invult, werkt in dezelfde gegevens. Bedenk iets dat niet makkelijk te raden is.</div>
    <div class="grid2"><input id="cloudCode" placeholder="Teamcode, bv. maliskamp-trainers" autocapitalize="off" autocomplete="off"><input id="cloudPin" placeholder="Pincode" inputmode="numeric" autocomplete="off"></div>
    <button class="btn pri full" style="margin-top:10px" data-act="cloudConnect">☁️ Verbinden</button>
  </div>`;
}

/* ===================== Slepen ===================== */
const drag = {src:null, ghost:null, active:false, sx:0, sy:0, el:null, hi:null, suppress:false};
function dropTarget(x, y){
  if (drag.ghost) drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  if (drag.ghost) drag.ghost.style.display = '';
  if (!under) return null;
  const f = under.closest('[data-drag="f"]');
  if (f) return {type:'f', i:+f.dataset.i, el:f};
  const b = under.closest('[data-drag="b"]');
  if (b) return {type:'b', id:b.dataset.id, el:b};
  const bz = under.closest('#benchZone');
  if (bz) return {type:'bz', el:bz};
  const pitch = under.closest('#livePitch');
  if (pitch){
    const r = pitch.getBoundingClientRect();
    return {type:'pitch', x:Math.max(6, Math.min(94, (x - r.left) / r.width * 100)), y:Math.max(5, Math.min(95, (y - r.top) / r.height * 100)), el:null};
  }
  return null;
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button > 0) return;
  if (e.pointerType === 'mouse') e.preventDefault();
  drag.el = el; drag.sx = e.clientX; drag.sy = e.clientY; drag.active = false;
  drag.src = el.dataset.drag === 'f' ? {type:'f', i:+el.dataset.i} : {type:'b', id:el.dataset.id};
});
document.addEventListener('pointermove', e => {
  if (!drag.el) return;
  if (!drag.active){
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
    const m = match();
    drag.active = true; ui.sel = null;
    document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.classList.add('ghost'); drag.ghost.removeAttribute('data-drag'); drag.ghost.removeAttribute('data-act');
    document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');
  }
  e.preventDefault();
  if (e.clientY < 90) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 110) window.scrollBy(0, 14);
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const t = dropTarget(e.clientX, e.clientY);
  const hiEl = t && t.el && t.el !== drag.el ? t.el : null;
  if (drag.hi !== hiEl){ drag.hi && drag.hi.classList.remove('drop-hi'); hiEl && hiEl.classList.add('drop-hi'); drag.hi = hiEl; }
}, {passive:false});
function endDrag(e, cancel){
  if (!drag.el) return;
  const wasActive = drag.active, src = drag.src;
  drag.hi && drag.hi.classList.remove('drop-hi');
  const t = wasActive && !cancel ? dropTarget(e.clientX, e.clientY) : null;
  drag.ghost && drag.ghost.remove();
  drag.el.classList.remove('dragging');
  drag.el = null; drag.ghost = null; drag.active = false; drag.hi = null;
  if (!wasActive) return;
  drag.suppress = true; setTimeout(() => drag.suppress = false, 400);
  const m = match(); if (!m || !m.segments || !t) { render(); return; }
  const lu = m.segments[ui.seg];
  if (t.type === 'pitch'){
    if (src.type === 'f'){ m.posOverride = m.posOverride || {}; m.posOverride[src.i] = {x:t.x, y:t.y}; }
    else {
      // bankspeler op het veld losgelaten: naar dichtstbijzijnde lege plek
      const pos = matchPositions(m);
      let best = -1, bd = 1e9;
      pos.forEach((p, i) => { if (lu[i]) return; const d = Math.hypot(p.x - t.x, p.y - t.y); if (d < bd){ bd = d; best = i; } });
      if (best >= 0) lu[best] = src.id; else { toast('Sleep op een speler om te wisselen'); render(); return; }
    }
  } else if (t.type === 'f' && src.type === 'f' && t.i === src.i){ render(); return; }
  else if (t.type === 'b' && src.type === 'b'){ render(); return; }
  else if (t.type === 'bz' && src.type === 'b'){ render(); return; }
  else swap(m, src, t);
  m.edited = true; save(); render();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

function shareMatch(m){
  const pos = matchPositions(m), times = segTimes(m.settings);
  let txt = `⚽ ${matchTitle(m)}${m.date ? ' (' + fmtDate(m.date, {}) + ')' : ''}\nFormatie ${m.settings.formation}\n`;
  m.segments.forEach((lu, s) => {
    txt += `\n${blockLabel(m, s)} (${times[s][0]}'–${times[s][1]}')\n`;
    pos.forEach((p, i) => { if (lu[i]) txt += `${p.line === 'K' ? '🧤 Kieper' : p.code}: ${pname(lu[i])}\n`; });
    const b = benchIds(m, s); if (b.length) txt += `Bank: ${b.map(pname).join(', ')}\n`;
  });
  if (navigator.share) navigator.share({title:matchTitle(m), text:txt}).catch(() => {});
  else navigator.clipboard?.writeText(txt).then(() => toast('Gekopieerd naar klembord'), () => alert(txt));
}
function buildPrint(m){
  const times = segTimes(m.settings), stt = stats(m);
  document.getElementById('print').innerHTML = iconize(`
    <div style="display:flex;align-items:center;gap:12px">${logoSrc ? `<img src="${logoSrc}" style="width:54px;height:54px;object-fit:contain">` : ''}<div><div style="font-weight:800;letter-spacing:.1em;color:#555;text-transform:uppercase">${esc(team().club || '')}</div><h2>${esc(matchTitle(m))}</h2></div></div>
    <div>${m.date ? fmtDate(m.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : ''} · ${settingsLine(m.settings)}</div>
    <div class="pg">${m.segments.map((lu, s) => `<div class="seg"><b>${blockLabel(m, s)} · ${times[s][0]}'–${times[s][1]}'</b>${pitchHTML(m, s, false)}<div style="font-size:12px;margin-top:4px">Bank: ${benchIds(m, s).map(id => esc(pname(id))).join(', ') || '–'}</div></div>`).join('')}</div>
    <table><tr><th>Speler</th>${times.map((t, i) => `<th>${blockLabel(m, i)}</th>`).join('')}<th>Minuten</th></tr>
    ${Object.entries(stt).map(([id, r]) => `<tr><td style="text-align:left">${esc(pname(id))}</td>${r.per.map(c => `<td>${c || 'W'}</td>`).join('')}<td>${Math.round(r.mins)}'</td></tr>`).join('')}</table>`);
}

if (!S.active.team) S.active.team = S.teams[0].id;
render();
document.getElementById('nav').innerHTML = iconize(document.getElementById('nav').innerHTML);
loadLogo();
cloudStart();
</script>
