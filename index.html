<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LineUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="LineUp">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png?v=3">
<meta name="theme-color" content="#07090f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<title>LineUp</title>
<style>
  /* ===================== Thema's ===================== */
  :root, body[data-theme="neon"]{
    --bg:#07090f; --bg2:radial-gradient(1200px 600px at 10% -10%, rgba(198,255,61,.10), transparent 60%), radial-gradient(900px 500px at 110% 10%, rgba(34,211,238,.10), transparent 60%);
    --surf:rgba(255,255,255,.045); --surf2:rgba(255,255,255,.07); --solid:#11151f; --line:rgba(255,255,255,.09);
    --txt:#f3f6fb; --muted:#8b94a8; --acc:#c6ff3d; --acc2:#22d3ee; --on-acc:#07090f;
    --hdr:linear-gradient(135deg,#0d1220 0%,#0a0f1a 60%); --hdr-txt:#fff; --hdr-glow:0 0 40px rgba(198,255,61,.25);
    --pitch1:#0f3b2a; --pitch2:#124431; --pline:rgba(198,255,61,.35); --kp:#22d3ee;
    --ok:#3ee08f; --red:#ff4d6d; --shadow:0 10px 30px rgba(0,0,0,.35); --blur:blur(14px); --radius:20px;
    color-scheme:dark;
  }



  :root{ --team:#c8102e; --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --disp:"Archivo","Inter",-apple-system,sans-serif; }

  /* ===================== Basis ===================== */
  body{--soft:color-mix(in srgb,var(--acc) 16%,transparent)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px}
  body{background:var(--bg2),var(--bg);background-attachment:fixed;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  h1,h2,.mt,.bigscore,.tile b,.brand .app{font-family:var(--disp);letter-spacing:-.02em}
  a{color:var(--acc)}
  select,input,textarea{font:inherit;color:var(--txt);background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
  select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
  select option{color:#111}
  main{padding:14px;max-width:760px;margin:0 auto}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
  label.f>*{margin-top:5px}
  details summary{cursor:pointer;font-weight:700;list-style:none}
  details summary::-webkit-details-marker{display:none}

  /* ===================== Kop ===================== */
  header{position:relative;z-index:20;color:var(--hdr-txt);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:var(--hdr);box-shadow:var(--hdr-glow);border-bottom:1px solid var(--line);overflow:hidden}
  body[data-theme="neon"] header::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;max-width:760px;margin-left:auto;margin-right:auto}
  .logo{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.25);overflow:hidden}
  .logo img{width:84%;height:84%;object-fit:contain}
  .brand .club{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.85}
  .brand .club:empty{display:none}
  .brand .app{font-size:21px;font-weight:900;line-height:1.05}
  body[data-theme="neon"] .brand .app{background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
  .teams{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;max-width:760px;margin:0 auto;scrollbar-width:none}
  .teams::-webkit-scrollbar{display:none}
  header .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:var(--hdr-txt)}
  header .pill.on{background:#fff;color:#111;border-color:#fff}
  body[data-theme="neon"] header .pill.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);box-shadow:0 0 18px rgba(198,255,61,.45)}
  .cloud{font-size:12px;font-weight:800;margin-left:auto;background:rgba(255,255,255,.14);padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .cloud:empty{display:none}

  /* ===================== Bouwstenen ===================== */
  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .card h2{font-size:17px;margin:0 0 12px;font-weight:800}
  .pill{border:1px solid var(--line);background:var(--surf2);color:var(--txt);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer;font-family:inherit}
  .pill.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--surf2);color:var(--txt);border:1px solid var(--line);transition:transform .08s, filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2)));color:var(--on-acc);border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 35%,transparent)}
  .btn.pri2{border:2px solid var(--acc);color:var(--acc);background:transparent}
  .btn.red{background:transparent;color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
  .btn.sm{padding:8px 11px;font-size:14px;border-radius:12px}
  .btn.full{width:100%}
  .btn.big{padding:17px;font-size:18px;margin-bottom:10px;border-radius:18px}
  .btn[disabled]{opacity:.45}
  .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
  .num{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
  .tags{display:flex;gap:4px}
  .tag{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;cursor:pointer}
  .tag.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
  .list .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .list .item:last-child{border-bottom:0}
  .item .grow{flex:1;min-width:0}
  .item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .match{cursor:pointer}
  .badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--surf2);color:var(--muted);white-space:nowrap}
  .badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .badge.live{background:var(--soft);color:var(--acc)}
  .empty{text-align:center;padding:26px 10px;color:var(--muted)}
  .empty b{display:block;font-size:36px;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

  /* ===================== Navigatie ===================== */
  nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:520px;margin:0 auto;z-index:30;display:flex;background:color-mix(in srgb,var(--solid) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px}
  nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:16px}
  nav button b{font-size:20px;font-weight:400}
  nav button.on{color:var(--on-acc);background:var(--acc)}

  /* ===================== Stepper / segmented ===================== */
  .set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .set:last-child{border-bottom:0}
  .set .lbl{font-weight:700;font-size:15px}
  .set .lbl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .step{display:flex;align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:14px;flex:none}
  .step button{width:44px;height:44px;border:0;background:none;color:var(--acc);font-size:24px;font-weight:800;cursor:pointer}
  .step b{min-width:34px;text-align:center;font-size:19px}
  .segc{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:6px}
  .segc button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:800;padding:10px 4px;border-radius:10px;cursor:pointer}
  .segc button.on{background:var(--acc);color:var(--on-acc)}
  .stabs{display:flex;gap:4px;background:color-mix(in srgb,var(--solid) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px;position:sticky;top:8px;z-index:15;box-shadow:var(--shadow)}
  .stabs button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:10px 2px;border-radius:12px;cursor:pointer}
  .stabs button.on{background:var(--acc);color:var(--on-acc)}
  .summary{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:12px;font-size:13px;color:var(--muted);cursor:pointer}
  .summary b{color:var(--txt)} .summary span{color:var(--acc);font-weight:800;white-space:nowrap}

  /* ===================== Fasebalk ===================== */
  .phases{position:sticky;top:0;z-index:25;display:grid;grid-template-columns:34px repeat(4,1fr);gap:4px;margin:-14px -14px 12px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:color-mix(in srgb,var(--solid) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .phases button{border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:9px 2px;border-radius:12px;cursor:pointer;line-height:1.25}
  .phases button.past{color:var(--ok)}
  .phases button.on{background:var(--acc);color:var(--on-acc)}
  .phases .pback{font-size:24px;color:var(--txt);padding:4px 0}

  /* ===================== Wedstrijd ===================== */
  .mhead{position:relative;overflow:hidden}
  .mhead .mt{font-size:23px;font-weight:900;line-height:1.1}
  .mhead .club{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--acc);margin-bottom:3px}
  .bigscore{font-size:52px;font-weight:900;text-align:center;margin-top:8px;letter-spacing:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .segs{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .segs .pill{width:100%;text-align:left;font-size:15px;padding:11px 14px;border-radius:14px;display:flex;justify-content:space-between}
  .pill.now:not(.on){border-color:var(--acc);color:var(--acc)}
  .wissel{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tools .btn{flex:1 1 auto}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

  /* ===================== Veld ===================== */
  .pitch{position:relative;width:100%;aspect-ratio:68/90;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(0,0,0,.25)}
  .pitch,.bench{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .pitch .ln{position:absolute;border:2px solid var(--pline)}
  .pitch .mid{left:0;right:0;top:50%;border-width:2px 0 0}
  .pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
  .pitch .box{left:22%;right:22%;height:14%}
  .pitch .box.t{top:-2px}.pitch .box.b{bottom:-2px}
  .pitch .goal{left:40%;right:40%;height:4%}
  .pitch .goal.t{top:-2px}.pitch .goal.b{bottom:-2px}
  .pitch .wm{position:absolute;left:50%;top:50%;width:22%;transform:translate(-50%,-50%);opacity:.18;pointer-events:none}
  .pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px;cursor:pointer;user-select:none;touch-action:none}
  .pl .dot{position:relative;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));color:var(--on-acc);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.9)}
  body[data-theme="neon"] .pl .dot{box-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 2px rgba(0,0,0,.4)}
  .pl.k .dot{background:linear-gradient(145deg,#1e2433,#0b0e16);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px var(--kp)}
  .pl.emptyp .dot{background:rgba(0,0,0,.25);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6);border:2px dashed transparent}
  .pl .nm{color:#fff;margin-top:4px;font-size:12px;font-weight:800;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:2px 7px;border-radius:999px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl.emptyp .nm{opacity:.75;font-weight:600}
  .pl .mb{position:absolute;top:-7px;right:-13px;background:#fff;color:#111;font-style:normal;font-size:10px;font-weight:900;padding:0 5px;border-radius:999px;line-height:1.5;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pitch.lg .pl .dot{width:48px;height:48px;font-size:13px}
  .pitch.lg .pl .nm{font-size:13px}
  .pitch.sm .pl{width:74px}
  .pitch.sm .pl .dot{width:36px;height:36px;font-size:11px}
  .pitch.sm .pl .nm{font-size:11px;max-width:74px}
  .pl.sel .dot,.benchp.sel{outline:3px solid #fff;outline-offset:3px;animation:pulse 1s infinite}
  @keyframes pulse{50%{outline-color:var(--acc)}}

  /* ===================== Bank ===================== */
  .benchtitle{margin-top:16px;font-weight:900;font-size:17px;font-family:var(--disp)}
  .benchtitle span{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;font-family:var(--font)}
  .bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  #benchZone{min-height:48px;border-radius:14px;padding:4px}
  .benchp{display:flex;align-items:center;gap:8px;padding:6px 13px 6px 6px;font-size:16px;font-weight:800;border-radius:999px;border:1px solid var(--line);background:var(--surf2);cursor:pointer;touch-action:none}
  .benchp .bd{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none}
  .benchp i{font-style:normal;color:var(--muted);font-size:13px}
  .benchp.low{border-color:var(--acc);background:var(--soft)}
  .benchp.low i{color:var(--acc);font-weight:900}
  .ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);opacity:.95}
  .dragging{opacity:.35}
  .drop-hi .dot,.drop-hi.benchp,#benchZone.drop-hi{outline:3px dashed var(--acc);outline-offset:3px}

  /* ===================== Tabellen & statistiek ===================== */
  table.ov{width:100%;border-collapse:collapse;font-size:13px}
  table.ov th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  table.ov th,table.ov td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.ov td:first-child,table.ov th:first-child{text-align:left}
  table.ov .w{color:var(--muted)}
  table.ov .kp{color:var(--kp);font-weight:800}
  table.ov .cur{background:var(--soft)}
  .bar{height:6px;background:var(--surf2);border-radius:999px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
  .tile b{display:block;font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile span{font-size:12px;color:var(--muted)}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sc{background:var(--surf2);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .scl{font-weight:800;text-align:center}
  .sc .step b{font-size:28px;min-width:44px}

  /* ===================== Aanwezig, teams, modals ===================== */
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .whop{border:1px solid var(--line);background:var(--surf2);color:var(--muted);border-radius:14px;padding:10px 13px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:line-through;opacity:.7}
  .whop.on{border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--txt);text-decoration:none;opacity:1}
  .whop small{font-size:11px;background:var(--acc);color:var(--on-acc);border-radius:6px;padding:1px 5px;margin-left:3px}
  .tcard{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--surf2)}
  .tcard.on{border:2px solid var(--acc);background:var(--soft)}
  .card .cloud{background:none;margin:0}
  .card .cloud.ok{color:var(--ok)} .card .cloud.err{color:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .modal .box{background:var(--solid);color:var(--txt);border:1px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.45);max-height:85vh;overflow:auto}
  .modal p{margin:0 0 14px;font-size:17px;font-weight:700}
  .subrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:6px}
  .subrow select{padding:10px 6px;font-size:15px}
  #outdated{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:300;background:var(--acc);color:var(--on-acc);padding:14px;border-radius:16px;font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
  .diag{margin-top:10px;background:color-mix(in srgb,#f3b52a 16%,transparent);border:1px solid color-mix(in srgb,#f3b52a 50%,transparent);border-radius:12px;padding:10px;font-size:13px}
  .chk{display:flex;flex-wrap:wrap;gap:6px}
  .gk{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:6px 9px;font-size:13px;font-weight:700}

  .switch{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surf2);position:relative;cursor:pointer;flex:none;padding:0}

function getFormation(fp, name){ const list = FORMATIONS[fp] || FORMATIONS[11]; return list.find(f => f.n === name) || list[0]; }
function positions(fp, name){
  const f = getFormation(fp, name), keeper = f.k !== false, out = [];
  if (keeper) out.push({code:'K', line:'K', x:50, y:89});
  const L = f.l.length, yTop = 14, yBot = keeper ? 67 : 76;
  f.l.forEach((c, i) => {
    const line = L === 1 ? 'M' : i === 0 ? 'V' : i === L - 1 ? 'A' : 'M';
    const y = L === 1 ? 50 : yBot - i * (yBot - yTop) / (L - 1);
    const m = c >= 5 ? 10 : c === 4 ? 13 : c === 3 ? 18 : 28;
    let codes = CODES[line][c] || Array(c).fill(line);
    if (line === 'M' && L >= 4){ // meerdere middenvelden: verdedigend en aanvallend
      if (i === 1 && c <= 2) codes = Array(c).fill('VM');
      else if (i === L - 2 && c === 1) codes = ['AM'];
      else if (i === L - 2 && c === 3 && f.l[1] <= 2) codes = ['LM', 'AM', 'RM'];
    }
    for (let j = 0; j < c; j++) out.push({code:codes[j], line, x: c === 1 ? 50 : m + j * (100 - 2 * m) / (c - 1), y});
  });
  return out;
}

/* ===================== Opstelling berekenen ===================== */
function shuffled(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function segTimes(st){
  const n = st.subMoments + 1;
  if (Array.isArray(st.cuts) && st.cuts.length === n - 1){
    const b = [0, ...st.cuts, st.matchMinutes];
    return Array.from({length:n}, (_, i) => [b[i], b[i + 1]]);
  }
  const len = st.matchMinutes / n;
  return Array.from({length:n}, (_, i) => [Math.round(i * len), Math.round((i + 1) * len)]);
}
// Kiepersloten: vast = 1, helft = 2, blok = aantal blokken
function keeperSlots(st){
  const times = segTimes(st), n = times.length;
  if (st.keeperMode === 'blok') return times.map((t, i) => ({label:`Blok ${i+1} · ${t[0]}'–${t[1]}'`, segs:[i]}));
  if (st.keeperMode === 'helft' && n > 1){
    const half = st.matchMinutes / 2;
    let h = times.findIndex(t => t[0] >= half); if (h <= 0) h = Math.ceil(n / 2);
    return [{label:`1e helft · 0'–${times[h-1][1]}'`, segs:[...Array(h).keys()]},
            {label:`2e helft · ${times[h][0]}'–${st.matchMinutes}'`, segs:[...Array(n - h).keys()].map(i => i + h)}];
  }
  return [{label:'Hele wedstrijd', segs:[...Array(n).keys()]}];
}
// Posities van deze wedstrijd (met eventueel zelf verschoven plekken)
function matchPositions(m){
  const pos = positions(m.settings.fieldPlayers, m.settings.formation);
  const o = m.posOverride || {};
  return pos.map((p, i) => o[i] ? {...p, x:o[i].x, y:o[i].y} : p);
}
// Minuten per speler in blok 0..upto (incl.)
function playedUpTo(m, upto){
  const times = segTimes(m.settings), res = {};
  m.present.forEach(id => res[id] = 0);
  (m.segments || []).forEach((lu, s) => {
    if (s > upto) return;
    lu.forEach(id => { if (id && id in res) res[id] += times[s][1] - times[s][0]; });
  });
  return res;
}

// from = eerste blok dat (opnieuw) berekend wordt; eerdere blokken blijven staan
// Vult de blokken vanaf 'from' opnieuw eerlijk in (alleen gebruikt tijdens een actieve wedstrijd)
function generate(m, mix, from){
  from = from || 0;
  const st = m.settings;
  const pos = positions(st.fieldPlayers, st.formation);
  const times = segTimes(st), nSeg = times.length;
  const present = m.present.filter(id => player(id));
  const order = mix ? shuffled(present) : present.slice();
  const mins = {}, benchedLast = {}, playedCodes = {};
  order.forEach(id => { mins[id] = 0; benchedLast[id] = false; playedCodes[id] = new Set(); });
  const keep = from > 0 && m.segments ? m.segments.slice(0, from).map(lu => lu.slice()) : [];
  from = keep.length;
  let prev = null;
  keep.forEach((lu, s) => {
    order.forEach(id => {
      const i = lu.indexOf(id);
      if (i >= 0){ mins[id] += times[s][1] - times[s][0]; playedCodes[id].add(pos[i].code); benchedLast[id] = false; }
      else benchedLast[id] = true;
    });
    prev = lu;
  });
  const segs = keep;
  for (let s = from; s < nSeg; s++){
    const segLen = times[s][1] - times[s][0];
    const lineup = Array(pos.length).fill(null);
    const here = order.filter(id => avail(m, id, s));
    let chosen = here.map((id, i) => ({id, i}))
      .sort((a, b) => (mins[a.id] - mins[b.id]) || ((benchedLast[b.id] ? 1 : 0) - (benchedLast[a.id] ? 1 : 0)) || (a.i - b.i))
      .slice(0, pos.length).map(o => o.id);
    if (usePos() && pos[0].line === 'K' && !chosen.some(canKeep)){
      const k = here.filter(id => canKeep(id) && !chosen.includes(id)).sort((a, b) => mins[a] - mins[b])[0];
      if (k && chosen.length) chosen[chosen.length - 1] = k;
    }
    if (usePos()){
      const pairs = [];
      chosen.forEach(id => pos.forEach((P, i) => pairs.push({id, i, sc: prefScore(player(id), P) + (prev && prev[i] === id ? 4 : 0) + (playedCodes[id].has(P.code) ? 0 : .5)})));
      pairs.sort((a, b) => b.sc - a.sc);
      const used = new Set();
      pairs.forEach(x => { if (lineup[x.i] === null && !used.has(x.id)){ lineup[x.i] = x.id; used.add(x.id); } });
      // verbeteren door twee spelers van plek te laten ruilen zolang dat beter past
      const scoreAt = (id, i) => id ? prefScore(player(id), pos[i]) + (prev && prev[i] === id ? 4 : 0) : 0;
      for (let round = 0, better = true; better && round < 20; round++){
        better = false;
        for (let a = 0; a < lineup.length; a++) for (let b = a + 1; b < lineup.length; b++){
          const now = scoreAt(lineup[a], a) + scoreAt(lineup[b], b), swapped = scoreAt(lineup[b], a) + scoreAt(lineup[a], b);
          if (swapped > now){ [lineup[a], lineup[b]] = [lineup[b], lineup[a]]; better = true; }
        }
      }
    } else {
    const rest = [];
    chosen.forEach(id => {
      const pi = prev ? prev.indexOf(id) : -1;
      if (pi >= 0 && lineup[pi] === null){ lineup[pi] = id; return; }
      rest.push(id);
    });
    rest.forEach(id => {
      let best = -1, bestScore = -99;
      lineup.forEach((v, i) => {
        if (v !== null) return;
        const sc = playedCodes[id].has(pos[i].code) ? 0 : 1;
        if (sc > bestScore){ bestScore = sc; best = i; }
      });
      if (best >= 0) lineup[best] = id;
    });
    }
    order.forEach(id => {
      const i = lineup.indexOf(id);
      if (i >= 0){ mins[id] += segLen; playedCodes[id].add(pos[i].code); benchedLast[id] = false; }
      else benchedLast[id] = true;
    });
    segs.push(lineup);
    prev = lineup;
  }
  m.segments = segs;
}
// Lege plekken vanaf blok 'from' opvullen met de reserve die het minst gespeeld heeft
function fillHoles(m, from){
  const times = segTimes(m.settings);
  for (let s = from; s < m.segments.length; s++){
    const lu = m.segments[s];
    if (isEmptySeg(lu)) continue; // nog niet ingevulde blokken met rust laten
    lu.forEach((x, i) => {
      if (x) return;
      const up = playedUpTo(m, s - 1);
      const P = matchPositions(m)[i];
      const b = benchIds(m, s).sort((a, c) => ((up[a] || 0) - (up[c] || 0)) || (usePos() ? prefScore(player(c), P) - prefScore(player(a), P) : 0))[0];
      if (b) lu[i] = b;
    });
  }
}

function stats(m){
  const pos = matchPositions(m), times = segTimes(m.settings), res = {};
  m.present.filter(id => player(id)).forEach(id => res[id] = {mins:0, per:[]});
  (m.segments || []).forEach((lu, s) => {
    const len = times[s][1] - times[s][0];
    Object.keys(res).forEach(id => {
      const i = lu.indexOf(id);
      res[id].per.push(i >= 0 ? pos[i].code : null);
      if (i >= 0) res[id].mins += len;
    });
  });
  return res;
}

    ${pos.map((p, i) => {
      const id = lu[i], sel = interactive && ui.sel && ui.sel.type === 'f' && ui.sel.i === i;
      return `<div class="pl ${p.line === 'K' ? 'k' : ''} ${id ? '' : 'emptyp'} ${sel ? 'sel' : ''}" style="left:${p.x}%;top:${p.y}%" ${interactive ? `data-act="tapField" data-drag="f" data-i="${i}"` : ''}>
        <div class="dot">${p.line === 'K' ? '🧤' : p.code}${up && id ? `<i class="mb">${Math.round(up[id])}'</i>` : ''}</div><div class="nm">${id ? esc(pname(id)) : (interactive ? 'sleep hier' : '—')}</div></div>`;
    }).join('')}
  </div>`;
}

const avail = (m, id, s) => m.present.includes(id) && !!player(id) && !(m.out && m.out[id] != null && s >= m.out[id]);
const benchIds = (m, s) => m.present.filter(id => avail(m, id, s) && !m.segments[s].includes(id));
const isIn = (m, id) => m.present.includes(id) && !(m.out && m.out[id] != null);
const isEmptySeg = lu => !lu || lu.every(x => !x);

const PHASES = [['prep', '📝 Voorbereiding'], ['live', '▶️ Actief'], ['post', '🏁 Na wedstrijd'], ['done', '✅ Klaar']];
const phaseName = ph => (PHASES.find(p => p[0] === ph) || PHASES[0])[1];
function scoreLine(m){
  if (!hasScore(m)) return '';
  return m.home === false ? `${esc(m.goalsAgainst)} – ${esc(m.goalsFor)}` : `${esc(m.goalsFor)} – ${esc(m.goalsAgainst)}`;
}

function viewMatch(){
  const m = match();
  if (!m){ ui.matchId = null; return viewMatches(); }
  const se = season(), ph = m.phase || 'prep';
  if (ph === 'prep' && !m.cutsLocked){ // in de voorbereiding volgt de wedstrijd de instellingen
    let changed = false;
    ['fieldPlayers', 'formation', 'subMoments', 'matchMinutes'].forEach(k => { if (m.settings[k] !== se[k]){ m.settings[k] = se[k]; changed = true; } });
    if (changed){ delete m.settings.cuts; delete m.posOverride; fitSegments(m); save(); }
    if (m.settings.base !== se.subMoments + 1){ m.settings.base = se.subMoments + 1; save(); }
  }
  const st = m.settings, times = segTimes(st);
  if (ui.seg >= times.length) ui.seg = 0;
  const roster = [...se.players, ...(m.guests || [])];
  const nIn = roster.filter(p => isIn(m, p.id)).length;
  const last = times.length - 1;
  const editable = ph !== 'done';
  const cur = m.cur || 0;

  const phaseBar = `<div class="phases"><button class="pback" data-act="back" aria-label="Terug">‹</button>${PHASES.map(([k, l], i) => `<button class="${k === ph ? 'on' : ''} ${PHASES.findIndex(p => p[0] === ph) > i ? 'past' : ''}" data-act="phase" data-v="${k}">${l}</button>`).join('')}</div>`;

  const header = `
  <div class="card mhead">
    <div class="mt">${esc(matchTitle(m))}</div>
    <div class="muted">${fmtDate(m.date, {weekday:'long', day:'numeric', month:'long'})} · ${settingsLine(st)}</div>
    ${hasScore(m) && ph !== 'prep' ? `<div class="bigscore">${scoreLine(m)}</div>` : ''}
  </div>`;

  // ---- opstelling
  const up = playedUpTo(m, ui.seg), stt = stats(m);
  const bench = benchIds(m, ui.seg).sort((a, b) => up[a] - up[b]);
  const lu = m.segments[ui.seg];
  const minUp = Math.min(...bench.map(id => up[id]));
  const lineupCard = `
    <div class="card">
      <h2>${ph === 'live' ? '▶️ Live opstelling' : ph === 'prep' ? '📋 Opstelling maken' : '📋 Opstelling'}</h2>
      ${ph === 'prep' ? (usePos()
        ? `<div class="muted" style="margin-bottom:10px">Laat de app alle blokken en wissels invullen op basis van de voorkeursposities en eerlijke speeltijd, of sleep zelf.</div>
           <div class="grid2" style="margin-bottom:12px"><button class="btn pri" data-act="autoAll">⚡ Alles automatisch</button><button class="btn" data-act="autoMix">🔀 Andere verdeling</button></div>`
        : `<div class="muted" style="margin-bottom:10px">Zet per blok je spelers neer: eerst de start, dan de volgende wissels. Bij een nieuw blok wordt het vorige overgenomen. Tip: zet bij Instellingen de voorkeursposities aan, dan kan de app alles automatisch opstellen.</div>`) : ''}
      <div class="segs">${times.map((t, i) => `<button class="pill ${i === ui.seg ? 'on' : ''} ${ph === 'live' && i === cur ? 'now' : ''}" data-act="seg" data-i="${i}"><span>${ph === 'live' && i === cur ? '● ' : ''}${blockLabel(m, i)}</span><span>${t[0]}'–${t[1]}'</span></button>`).join('')}</div>
      ${ui.seg > 0 ? (() => {
        const prevLu = m.segments[ui.seg - 1];
        const ins = lu.filter(id => id && !prevLu.includes(id)), outs = prevLu.filter(id => id && !lu.includes(id));
        return `<div class="wissel">🔁 Op ${times[ui.seg][0]}': <b style="color:var(--ok)">erin</b> ${ins.map(id => esc(pname(id))).join(', ') || '–'} · <b style="color:var(--red)">eruit</b> ${outs.map(id => esc(pname(id))).join(', ') || '–'}</div>`;
      })() : ''}
      ${pitchHTML(m, ui.seg, editable, true)}
      ${editable ? `
      <div class="benchtitle">🪑 Reserves <span>minuten gespeeld t/m dit blok</span></div>
      <div class="bench" id="benchZone">${bench.length ? bench.map(id => {
        const p = player(id);
        return `<div class="benchp ${ui.sel && ui.sel.type === 'b' && ui.sel.id === id ? 'sel' : ''} ${up[id] === minUp && bench.length > 1 ? 'low' : ''}" data-act="tapBench" data-drag="b" data-id="${id}"><span class="bd">${esc(p.number || p.name.charAt(0).toUpperCase())}</span><span class="bn">${esc(p.name)}${prefTag(p)}</span><i>${Math.round(up[id])}'</i></div>`;
      }).join('') : '<span class="muted" style="padding:8px">Geen reserves · sleep een speler hierheen om hem eruit te halen</span>'}</div>
      <div class="hint">Sleep een reserve op een plek of speler, of tik op twee spelers om te wisselen.</div>
      <div class="tools">
        ${ui.seg > 0 ? `<button class="btn sm" data-act="copyPrev">📋 Neem vorige over</button>` : ''}
        ${ph === 'live' && ui.seg < last ? `<button class="btn sm" data-act="regenRest">🔄 Rest eerlijk verdelen</button>` : ''}
        <button class="btn sm" data-act="addSub">＋ Wisselmoment</button>
        ${ui.seg > 0 ? `<button class="btn sm" data-act="delSub">🗑️ Wisselmoment weg</button>` : ''}
        ${ph === 'prep' && m.cutsLocked ? `<button class="btn sm" data-act="resetSubs">↩️ Standaard wisselmomenten</button>` : ''}
        <button class="btn sm" data-act="clearSeg">🧹 Leeg</button>
        ${m.posOverride && Object.keys(m.posOverride).length ? `<button class="btn sm" data-act="resetPos">↩️ Posities terug</button>` : ''}
      </div>
      ${ph === 'live' && ui.seg < last ? `<div class="muted" style="margin-top:6px;font-size:12px">🔄 laat alles t/m dit blok staan en verdeelt de blokken erna opnieuw eerlijk.</div>` : ''}` : ''}
      ${ph === 'live' ? (cur < last
        ? `<button class="btn pri full big" style="margin-top:12px" data-act="nextSeg">⏭️ Wissel doorvoeren (${times[cur + 1][0]}')</button>`
        : `<button class="btn pri full big" style="margin-top:12px" data-act="phase" data-v="post">🏁 Wedstrijd afgelopen</button>`) : ''}
    </div>`;

  const minutesCard = `
    <div class="card">
      <h2>⏱️ Speeltijd</h2>
      <table class="ov">
        <tr><th>Speler</th>${times.map((t, i) => `<th class="${i === ui.seg ? 'cur' : ''}">${i + 1}</th>`).join('')}<th>${ph === 'done' || ph === 'post' ? 'Min' : 'Nu'}</th>${ph === 'done' || ph === 'post' ? '' : '<th>Tot.</th>'}</tr>
        ${Object.entries(stt).sort((a, b) => (ph === 'done' || ph === 'post') ? (b[1].mins - a[1].mins) : ((up[a[0]] - up[b[0]]) || (a[1].mins - b[1].mins))).map(([id, r]) => {
          const shown = (ph === 'done' || ph === 'post') ? r.mins : up[id];
          return `<tr>
          <td>${esc(pname(id))}${isIn(m, id) ? '' : ' <span class="muted">(weg)</span>'}<div class="bar"><i style="width:${Math.round(shown / st.matchMinutes * 100)}%"></i></div></td>
          ${r.per.map((c, i) => `<td class="${i === ui.seg ? 'cur ' : ''}${c ? (c === 'K' ? 'kp' : '') : 'w'}">${c ? (c === 'K' ? '🧤' : c) : (avail(m, id, i) ? 'W' : '–')}</td>`).join('')}
          <td><b>${Math.round(shown)}'</b></td>${ph === 'done' || ph === 'post' ? '' : `<td class="muted">${Math.round(r.mins)}'</td>`}</tr>`;
        }).join('')}
      </table>
      <div class="muted" style="margin-top:8px">${ph === 'done' || ph === 'post' ? 'W = reserve' : `Nu = gespeeld t/m blok ${ui.seg + 1} · Tot. = met de planning erbij · W = reserve · minst gespeeld bovenaan`}</div>
    </div>`;

  const presenceCard = `
  <div class="card">
    <details data-key="who" ${(ui.open.who ?? ph === 'prep') ? 'open' : ''}>
    <summary>👥 Wie zijn er? <span class="muted" style="font-weight:400">${nIn} van ${roster.length}</span></summary>
    <div class="who" style="margin-top:10px">
      ${roster.map(p => { const on = isIn(m, p.id); return `<button class="whop ${on ? 'on' : ''}" data-act="togglePresent" data-id="${p.id}">${on ? '✅' : '❌'} ${esc(p.name)}${p.guest ? ' <small>invaller</small>' : ''}</button>`; }).join('') || '<span class="muted">Nog geen spelers – voeg ze toe bij Instellingen.</span>'}
    </div>
    <div class="muted" style="margin-top:6px">Tik op een naam om iemand af of aan te melden.${ph === 'live' ? ' Tijdens de wedstrijd geldt dat vanaf het huidige blok; zijn plek wordt opgevuld door de reserve met de minste minuten.' : ''}</div>
    <div class="row" style="margin-top:10px"><input id="guestName" placeholder="Invaller (naam)" list="otherNames" style="flex:3"><button class="btn sm" style="flex:none" data-act="addGuest">＋ Invaller</button></div>
    <datalist id="otherNames">${S.teams.flatMap(t => t.id === team().id ? [] : t.seasons[t.seasons.length - 1].players.map(p => `<option value="${esc(p.name)}">`)).join('')}</datalist>
    ${(m.guests || []).length ? `<div class="muted" style="margin-top:8px">Invallers: ${m.guests.map(g => `${esc(g.name)} <button class="x" style="font-size:16px" data-act="delGuest" data-id="${g.id}">×</button>`).join(' ')}</div>` : ''}
    </details>
  </div>`;

  const infoCard = `
  <div class="card">
    <div class="grid2">
      <label class="f">Tegenstander<input data-m="opponent" value="${esc(m.opponent)}" placeholder="bv. VV Oranje"></label>
      <label class="f">Datum<input type="date" data-m="date" value="${esc(m.date)}"></label>
    </div>
    <div class="segc"><button class="${m.home !== false ? 'on' : ''}" data-act="home" data-v="1">🏠 Thuis</button><button class="${m.home === false ? 'on' : ''}" data-act="home" data-v="0">🚌 Uit</button></div>
    <div class="muted" style="margin-top:10px">⚙️ ${settingsLine(st)} · <a href="#" data-act="goSettings2">wijzigen bij Instellingen</a></div>
  </div>`;

  // ---- na de wedstrijd
  const goals = m.goals || {};
  const scorerTotal = Object.values(goals).reduce((a, b) => a + b, 0);
  const played = Object.entries(stt).filter(([id, r]) => r.mins > 0 || isIn(m, id)).map(([id]) => id);
  const scoreStep = (k, label) => `<div class="sc"><div class="scl">${label}</div><div class="step"><button data-act="score" data-k="${k}" data-d="-1">−</button><b>${m[k] === '' || m[k] == null ? 0 : m[k]}</b><button data-act="score" data-k="${k}" data-d="1">+</button></div></div>`;
  const postCard = `
  <div class="card">
    <h2>🏁 Eindstand</h2>
    <div class="scores">
      ${m.home === false ? scoreStep('goalsAgainst', esc(m.opponent || 'Tegenstander')) + scoreStep('goalsFor', esc(team().name)) : scoreStep('goalsFor', esc(team().name)) + scoreStep('goalsAgainst', esc(m.opponent || 'Tegenstander'))}
    </div>
  </div>
  <div class="card">
    <h2>⚽ Doelpuntenmakers</h2>
    <div class="muted" style="margin-bottom:6px">Tik + bij wie er scoorde. ${scorerTotal} van ${+m.goalsFor || 0} doelpunt${(+m.goalsFor || 0) === 1 ? '' : 'en'} toegewezen.</div>
    ${played.map(id => `<div class="set"><div class="lbl">${esc(pname(id))} ${'⚽'.repeat(Math.min(goals[id] || 0, 6))}</div><div class="step"><button data-act="goal" data-id="${id}" data-d="-1">−</button><b>${goals[id] || 0}</b><button data-act="goal" data-id="${id}" data-d="1">+</button></div></div>`).join('')}
    ${scorerTotal !== (+m.goalsFor || 0) ? `<div class="muted" style="color:var(--red);margin-top:8px">Let op: het aantal doelpuntenmakers (${scorerTotal}) klopt niet met de eindstand (${+m.goalsFor || 0}).</div>` : ''}
  </div>
  <button class="btn pri full big" data-act="saveDone">✅ Opslaan als gespeeld</button>`;

  const doneCard = `
  <div class="card">
    <h2>⚽ Doelpuntenmakers</h2>
    ${Object.entries(goals).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).map(([id, n]) => `<div class="set"><div class="lbl">${esc(pname(id))}</div><b>${'⚽'.repeat(Math.min(n, 6))} ${n}</b></div>`).join('') || '<div class="muted">Geen doelpuntenmakers ingevuld.</div>'}
  </div>`;

  let body;
  if (ph === 'prep') body = `${infoCard}${presenceCard}${lineupCard}${minutesCard}
    <button class="btn pri full big" data-act="phase" data-v="live">▶️ Start wedstrijd</button>
    <div class="grid2" style="margin-bottom:12px"><button class="btn" data-act="share">📤 Delen</button><button class="btn" data-act="print">🖨️ Printen</button></div>`;
  else if (ph === 'live') body = `${lineupCard}${minutesCard}${presenceCard}`;
  else if (ph === 'post') body = `${postCard}<div style="height:12px"></div>${lineupCard}${minutesCard}`;
  else body = `${doneCard}${minutesCard}${lineupCard}
    <div class="grid2" style="margin-bottom:12px"><button class="btn" data-act="share">📤 Delen</button><button class="btn" data-act="print">🖨️ Printen</button></div>
    <button class="btn full" style="margin-bottom:12px" data-act="phase" data-v="post">✏️ Uitslag of doelpunten aanpassen</button>`;

  return `
  ${phaseBar}${header}${body}
  <button class="btn red full" data-act="delMatch">Wedstrijd verwijderen</button>`;
}

function viewPlayers(){
  const se = season();
  const others = [];
  S.teams.forEach(t => t.seasons.forEach(s => { if (s.id !== se.id && s.players.length) others.push({t, s}); }));
  return `
  <div class="card list">
    <h2>👥 Selectie ${esc(team().name)} (${se.players.length})</h2>
    ${usePos() ? `<div class="muted" style="margin-bottom:4px">🎯 Kies per speler zijn 1e, 2e en 3e voorkeurspositie (posities uit formatie ${esc(se.formation)}).</div>` : `<div class="muted" style="margin-bottom:4px">Voorkeursposities per speler staan uit. Zet ze aan bij <a href="#" data-act="stab" data-v="team">⚙️ Opstelling</a>.</div>`}
    ${se.players.length ? se.players.map(p => `
      <div class="item" style="flex-wrap:wrap">

        <button class="x" data-act="delPlayer" data-id="${p.id}">×</button>
        ${usePos() ? `<div class="pprow">${[0, 1, 2].map(k => `<label><span>${k + 1}e keus</span><select data-pp="${k}" data-id="${p.id}"><option value="">–</option>${posCodes(se).map(c => `<option value="${c}" ${(p.pos || [])[k] === c ? 'selected' : ''}>${c} · ${POS_NAMES[c]}</option>`).join('')}</select></label>`).join('')}</div>` : ''}
      </div>`).join('') : `<div class="empty"><b>👥</b>Nog geen spelers. Voeg ze hieronder toe.</div>`}
  </div>
  <div class="card">
    <h2>➕ Speler toevoegen aan ${esc(team().name)}</h2>
    <div class="row"><input id="newName" placeholder="Naam speler" style="flex:3" enterkeyhint="done"><input id="newNum" placeholder="#" inputmode="numeric" style="flex:1"></div>
    <button class="btn pri full" style="margin-top:10px" data-act="addPlayer">Speler toevoegen</button>
    <details style="margin-top:12px"><summary class="muted">📝 Meerdere namen tegelijk plakken</summary>
      <textarea id="bulk" rows="5" style="margin-top:8px" placeholder="Eén naam per regel"></textarea>
      <button class="btn sm" style="margin-top:6px" data-act="bulk">Alles toevoegen</button>
    </details>
    ${others.length ? `<details style="margin-top:8px"><summary class="muted">📥 Overnemen uit ander team/seizoen</summary>
      <div class="row" style="margin-top:8px"><select id="copyFrom">${others.map(o => `<option value="${o.s.id}">${esc(o.t.name)} · ${esc(o.s.name)} (${o.s.players.length})</option>`).join('')}</select><button class="btn sm" style="flex:none" data-act="copyPlayers">Overnemen</button></div>
    </details>` : ''}
  </div>`;
}

function viewStats(){
  const se = season(), t = team();
  const done = se.matches.filter(m => m.phase === 'done' && m.segments);
  const rows = {};
  se.players.forEach(p => rows[p.id] = {p, matches:0, mins:0, possible:0, kmins:0, bench:0, blocks:0, pos:{}, goals:0});
  let w = 0, d = 0, l = 0, gf = 0, ga = 0, scored = 0;
  done.forEach(m => {
    const pos = matchPositions(m), times = segTimes(m.settings);
    m.present.forEach(id => {
      const r = rows[id]; if (!r) return;
      r.goals += (m.goals || {})[id] || 0;
      r.matches++; r.possible += m.settings.matchMinutes;
      m.segments.forEach((lu, s) => {
        const len = times[s][1] - times[s][0], i = lu.indexOf(id);
        r.blocks++;
        if (i >= 0){ r.mins += len; const c = pos[i].code; r.pos[c] = (r.pos[c] || 0) + 1; if (pos[i].line === 'K') r.kmins += len; }
        else r.bench++;
      });
    });
    if (hasScore(m)){
      const a = +m.goalsFor, b = +m.goalsAgainst;
      scored++; gf += a; ga += b; a > b ? w++ : a === b ? d++ : l++;
    }
  });
  const list = Object.values(rows).sort((a, b) => b.mins - a.mins);
  const maxMin = Math.max(1, ...list.map(r => r.mins));
  const keepers = list.filter(r => r.kmins > 0).sort((a, b) => b.kmins - a.kmins);
  const pct = r => r.possible ? Math.round(r.mins / r.possible * 100) : 0;
  const avgPct = (() => { const a = list.filter(r => r.possible); return a.length ? Math.round(a.reduce((s, r) => s + pct(r), 0) / a.length) : 0; })();

  if (!done.length) return `<div class="card empty"><b>📊</b>Nog geen statistieken voor ${esc(t.name)} ${esc(se.name)}.<br>Statistieken tellen mee zodra een wedstrijd is opgeslagen als ✅ gespeeld.</div>`;
  return `
  <div class="tiles">
    <div class="tile"><b>${done.length}</b><span>wedstrijden</span></div>
    <div class="tile"><b>${scored ? `${w}-${d}-${l}` : '–'}</b><span>W-G-V</span></div>
    <div class="tile"><b>${scored ? `${gf}:${ga}` : '–'}</b><span>doelpunten</span></div>
  </div>
  <div class="card">
    <h2>⏱️ Speeltijd per speler</h2>
    <div class="muted" style="margin-bottom:8px">% = deel van de minuten in wedstrijden waarbij de speler aanwezig was. Gemiddeld ${avgPct}%.</div>
    <table class="ov">
      <tr><th>Speler</th><th>Wed</th><th>Min</th><th>%</th><th>⚽</th><th>🧤</th><th>Bank</th></tr>
      ${list.map(r => {
        const top = Object.entries(r.pos).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c]) => c === 'K' ? '🧤' : c).join(' · ');
        return `<tr>
          <td>${esc(r.p.name)}<div class="bar"><i style="width:${Math.round(r.mins / maxMin * 100)}%"></i></div>${top ? `<div class="muted" style="font-size:11px;margin-top:2px">${top}</div>` : ''}</td>
          <td>${r.matches}</td><td><b>${Math.round(r.mins)}'</b></td>
          <td style="color:${pct(r) < avgPct - 10 ? 'var(--red)' : 'inherit'}">${r.possible ? pct(r) + '%' : '–'}</td>
          <td><b>${r.goals || ''}</b></td><td class="kp">${r.kmins ? Math.round(r.kmins) + "'" : ''}</td><td class="w">${r.bench}×</td></tr>`;
      }).join('')}
    </table>
    <div class="muted" style="margin-top:8px">Bank = aantal blokken op de bank. Rood = duidelijk minder speeltijd dan gemiddeld.</div>
  </div>
  ${list.some(r => r.goals) ? `<div class="card">
    <h2>⚽ Topscorers</h2>
    ${list.filter(r => r.goals).sort((a, b) => b.goals - a.goals).map(r => `<div class="set"><div class="lbl">${esc(r.p.name)}</div><b>${r.goals}</b></div>`).join('')}
  </div>` : ''}
  ${keepers.length ? `<div class="card">
    <h2>🧤 In de goal dit seizoen</h2>
    ${keepers.map(r => `<div class="set"><div class="lbl">${esc(r.p.name)}</div><b>${Math.round(r.kmins)} min</b></div>`).join('')}
  </div>` : ''}
  <div class="card list">
    <h2>📋 Uitslagen</h2>

/* ===================== Eigen pop-ups (werken ook als web-app op beginscherm) ===================== */
function sheet(html){
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = iconize(`<div class="box">${html}</div>`);
    document.body.appendChild(d);
    const inp = d.querySelector('input');
    const done = ok => { d.remove(); res(ok ? (inp ? inp.value : true) : (inp ? null : false)); };
    d.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === 'ok'); else if (e.target === d) done(false); });
    inp && inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(true); });
    setTimeout(() => inp && inp.focus(), 60);
  });
}
const ask = (msg, ok) => sheet(`<p>${esc(msg)}</p><div class="grid2"><button class="btn" data-r="no">Annuleren</button><button class="btn pri" data-r="ok">${esc(ok || 'Ja')}</button></div>`);

const askText = (msg, val) => sheet(`<p>${esc(msg)}</p><input value="${esc(val)}" style="font-size:18px"><div class="grid2" style="margin-top:12px"><button class="btn" data-r="no">Annuleren</button><button class="btn pri" data-r="ok">OK</button></div>`);
const askNum = (msg, val) => sheet(`<p>${esc(msg)}</p><input type="number" inputmode="numeric" value="${esc(val)}" style="font-size:22px;text-align:center"><div class="grid2" style="margin-top:12px"><button class="btn" data-r="no">Annuleren</button><button class="btn pri" data-r="ok">OK</button></div>`);

/* ===================== Acties ===================== */
function toast(msg){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = stripEmo(msg); document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const commit = () => { save(); render(); };
const go = tab => { ui.tab = tab; ui.matchId = null; ui.sel = null; render(); window.scrollTo(0, 0); };

function newMatch(){
  const se = season();
  const m = {id:uid(), opponent:'', date:new Date().toISOString().slice(0, 10), home:true,
    present: se.players.map(p => p.id), keepers:{}, goalsFor:'', goalsAgainst:'',
    settings:{fieldPlayers:se.fieldPlayers, formation:se.formation, subMoments:se.subMoments, matchMinutes:se.matchMinutes, keeperMode:se.keeperMode, base:se.subMoments + 1},
    segments:Array.from({length: se.subMoments + 1}, () => Array(positions(se.fieldPlayers, se.formation).length).fill(null)),
    phase:'prep', cur:0, goals:{}};
  se.matches.push(m);
  ui.open = {}; ui.matchId = m.id; ui.seg = 0; ui.sel = null; commit(); window.scrollTo(0, 0);
}
async function saveDone(m){
  const tot = Object.values(m.goals || {}).reduce((a, b) => a + b, 0);
  if (m.goalsFor === '' || m.goalsFor == null){ m.goalsFor = 0; m.goalsAgainst = m.goalsAgainst || 0; }
  if (tot !== +m.goalsFor && !await ask(`Er zijn ${tot} doelpuntenmakers ingevuld bij ${m.goalsFor} doelpunt(en). Toch opslaan?`, 'Opslaan')) return;
  m.phase = 'done'; m.cutsLocked = true; ui.seg = 0; ui.sel = null; commit(); window.scrollTo(0, 0);
  toast('Wedstrijd opgeslagen als gespeeld ✅');
}
function swap(m, a, b){
  const lu = m.segments[ui.seg];
  if (a.type === 'f' && b.type === 'f') [lu[a.i], lu[b.i]] = [lu[b.i], lu[a.i]];
  else if (a.type === 'bz' || b.type === 'bz'){ const f = a.type === 'f' ? a : b; if (f.type === 'f') lu[f.i] = null; }
  else { const f = a.type === 'f' ? a : b, bn = a.type === 'b' ? a : b; lu[f.i] = bn.id; }
  m.edited = true;
}
function fitSegments(m){
  const n = m.settings.subMoments + 1, len = positions(m.settings.fieldPlayers, m.settings.formation).length;
  const segs = (m.segments || []).slice(0, n).map(lu => { lu = lu.slice(0, len); while (lu.length < len) lu.push(null); return lu; });
  while (segs.length < n) segs.push(segs.length ? segs[segs.length - 1].slice() : Array(len).fill(null));
  m.segments = segs;
}
function regenIfNeeded(m){
  if (!m || !m.segments) return;
  if (m.manual){ fitSegments(m); toast('Blokken aangepast'); }
  else { generate(m, false); toast('Opstelling bijgewerkt'); }
}
function addPlayerFromForm(){
  const se = season(), n = document.getElementById('newName').value.trim();
  if (!n){ document.getElementById('newName').focus(); return; }
  se.players.push({id:uid(), name:n, number:document.getElementById('newNum').value.trim(), pref:[]});
  commit(); toast(`${n} toegevoegd`); document.getElementById('newName').focus();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-tab]');
  if (drag.suppress){ drag.suppress = false; if (e.target.closest('[data-drag],#livePitch,#benchZone')) return; }
  if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT')) return;
  if (el.dataset.tab){ if (el.dataset.tab === 'settings') ui.sOpen = true; go(el.dataset.tab); return; }
  const act = el.dataset.act, id = el.dataset.id, se = season(), m = match();
  const tgt = el.dataset.scope === 'match' ? m && m.settings : se;
  switch (act){
    case 'team': S.active.team = id; ui.matchId = null; ui.sel = null; ui.tab = 'matches'; commit(); window.scrollTo(0, 0); break;
    case 'goSettings': { const r = await newTeamDialog(); if (r) createTeam(r.name, r.club, r.season); break; }
    case 'goSettings2': e.preventDefault(); ui.sOpen = true; ui.stab = 'team'; go('settings'); break;
    case 'goPlayers': ui.sOpen = true; ui.stab = 'spelers'; go('settings'); break;
    case 'sOpen': S.active.team = id; ui.sOpen = true; ui.stab = 'team'; ui.matchId = null; commit(); window.scrollTo(0, 0); break;
    case 'sHome': ui.sOpen = true; render(); window.scrollTo(0, 0); break;
    case 'teamColor': { const tt = S.teams.find(x => x.id === id); tt.color = el.dataset.c; commit(); break; }
    case 'stab': e.preventDefault(); ui.stab = el.dataset.v; render(); break;
    case 'togglePresent': {
      const pid = el.dataset.id, from = m.phase === 'live' ? (m.cur || 0) : 0;
      if (isIn(m, pid)){
        const played = from > 0 && m.segments.slice(0, from).some(lu => lu.includes(pid));
        if (played){ m.out = m.out || {}; m.out[pid] = from; }
        else m.present = m.present.filter(x => x !== pid);
        m.segments.forEach((lu, s) => { if (s >= from) lu.forEach((x, i) => { if (x === pid) lu[i] = null; }); });
        if (m.phase === 'live'){ fillHoles(m, from); toast(`${pname(pid)} is eruit – plek opgevuld`); }
      } else {
        if (m.out && m.out[pid] != null) delete m.out[pid];
        if (!m.present.includes(pid)) m.present.push(pid);
        if (m.phase === 'live') toast(`${pname(pid)} staat bij de reserves`);
      }
      commit(); break;
    }
    case 'phase': {
      const v = el.dataset.v;
      if (v === 'done'){ await saveDone(m); break; }
      if (v !== 'prep') m.cutsLocked = true;
      if (v === 'live'){ m.cur = m.cur || 0; ui.seg = m.cur; if (m.phase === 'prep') toast('Wedstrijd gestart – succes! ⚽'); }
      if (v === 'post' && (m.goalsFor === '' || m.goalsFor == null)){ m.goalsFor = 0; m.goalsAgainst = 0; }
      m.phase = v; ui.sel = null; commit(); window.scrollTo(0, 0); break;
    }
    case 'nextSeg': {
      const n = m.segments.length;
      if ((m.cur || 0) >= n - 1) break;
      m.cur = (m.cur || 0) + 1; ui.seg = m.cur; ui.sel = null;
      if (isEmptySeg(m.segments[m.cur])) m.segments[m.cur] = m.segments[m.cur - 1].slice();
      commit(); toast(`Wissel doorgevoerd – blok ${m.cur + 1} loopt`); window.scrollTo(0, 0); break;
    }
    case 'score': { const k = el.dataset.k; m[k] = Math.max(0, (+m[k] || 0) + (+el.dataset.d)); commit(); break; }
    case 'goal': {
      m.goals = m.goals || {}; const gid = el.dataset.id;
      m.goals[gid] = Math.max(0, (m.goals[gid] || 0) + (+el.dataset.d));
      const tot = Object.values(m.goals).reduce((a, b) => a + b, 0);
      if (tot > (+m.goalsFor || 0)) m.goalsFor = tot;
      commit(); break;
    }
    case 'saveDone': await saveDone(m); break;
    case 'addGuest': {
      const n = document.getElementById('guestName').value.trim();
      if (!n){ document.getElementById('guestName').focus(); return; }
      const g = {id:uid(), name:n, number:'', pref:[], guest:true};
      m.guests = m.guests || []; m.guests.push(g); m.present.push(g.id);
      commit(); toast(`${n} doet mee als invaller`); break;
    }
    case 'delGuest': {
      m.guests = (m.guests || []).filter(g => g.id !== id); m.present = m.present.filter(x => x !== id);
      m.segments = m.segments.map(lu => lu.map(x => x === id ? null : x)); if (m.phase === 'live') fillHoles(m, m.cur || 0);
      commit(); break;
    }
    case 'newMatch': newMatch(); break;
    case 'openMatch': ui.open = {}; ui.tab = 'matches'; ui.matchId = id; ui.seg = 0; ui.sel = null; render(); window.scrollTo(0, 0); break;
    case 'back': ui.matchId = null; ui.sel = null; render(); break;
    case 'step': {
      const k = el.dataset.k, [mn, mx, stp] = LIMITS[k];
      tgt[k] = Math.max(mn, Math.min(mx, tgt[k] + (+el.dataset.d) * stp));
      if (k === 'fieldPlayers') tgt.formation = FORMATIONS[tgt[k]][0].n;
      if (k !== 'fieldPlayers') delete tgt.cuts;
      if (el.dataset.scope === 'match'){ if (k === 'fieldPlayers') delete m.posOverride; regenIfNeeded(m); }
      commit(); break;
    }
    case 'kmode':
      tgt.keeperMode = el.dataset.v;
      if (el.dataset.scope === 'match'){ m.keepers = {}; regenIfNeeded(m); }
      commit(); break;
    case 'home': m.home = el.dataset.v === '1'; commit(); break;
    case 'gen': case 'mix':
      if (m.segments && m.edited && !await ask('Je handmatige wissels worden overschreven. Doorgaan?')) return;
      m.manual = false; generate(m, act === 'mix'); ui.seg = 0; ui.sel = null; ui.open.setup = false; commit();
      if (act === 'mix') toast('Nieuwe verdeling gemaakt');
      break;
    case 'seg': {
      ui.seg = +el.dataset.i; ui.sel = null;
      if (ui.seg > 0 && isEmptySeg(m.segments[ui.seg]) && !isEmptySeg(m.segments[ui.seg - 1])){ m.segments[ui.seg] = m.segments[ui.seg - 1].slice(); save(); toast('Vorig blok overgenomen – pas de wissels aan'); }
      render(); break;
    }
    case 'manual': {
      if (m.segments && !await ask('Je huidige opstelling wordt leeggemaakt. Zelf opnieuw beginnen?')) return;
      const len = positions(m.settings.fieldPlayers, m.settings.formation).length;
      m.segments = Array.from({length: m.settings.subMoments + 1}, () => Array(len).fill(null));
      m.manual = true; m.edited = true; ui.seg = 0; ui.sel = null; ui.open.setup = false; commit();
      toast('Sleep spelers van de bank naar het veld'); break;
    }
    case 'copyPrev': m.segments[ui.seg] = m.segments[ui.seg - 1].slice(); m.edited = true; commit(); toast('Vorig blok overgenomen'); break;
    case 'clearSeg': m.segments[ui.seg] = m.segments[ui.seg].map(() => null); m.edited = true; commit(); break;
    case 'regenRest': generate(m, false, ui.seg + 1); m.edited = true; commit(); toast('De rest van de wedstrijd is opnieuw eerlijk verdeeld'); break;
    case 'resetPos': delete m.posOverride; commit(); break;
    case 'addSub': {
      const times = segTimes(m.settings), b = m.phase === 'live' ? (m.cur || 0) : ui.seg;
      let def = Math.round((times[b][0] + times[b][1]) / 2);
      if (times.some(t => t[0] === def)) def = times[b][0] + 1;
      const r = await subDialog(m, def);
      if (!r) return;
      addSubMoment(m, r.min, r.s, r.pairs);
      commit(); window.scrollTo(0, 0);
      toast(r.pairs.length ? `Wissel op ${r.min}' toegevoegd` : `Wisselmoment op ${r.min}' toegevoegd – zet de wissel op het veld`); break;
    }
    case 'delSub': {
      const t = segTimes(m.settings)[ui.seg];
      const happened = m.phase === 'live' && ui.seg <= (m.cur || 0);
      if (!await ask(`Wisselmoment op ${t[0]}' (${blockLabel(m, ui.seg)}) weghalen?${happened ? ' Deze wissel is al gebeurd: de spelers van het blok ervoor tellen dan door tot ' + t[1] + "'." : ' De opstelling van het blok ervoor loopt dan door.'}`, 'Weghalen')) return;
      removeSubMoment(m, ui.seg); commit(); toast('Wisselmoment weggehaald'); break;
    }
    case 'resetSubs': {
      if (!await ask('Terug naar de standaard wisselmomenten uit Instellingen?', 'Ja')) return;
      m.cutsLocked = false; delete m.settings.cuts; m.settings.subMoments = -1; ui.seg = 0; commit(); break;
    }
    case 'splitSeg': {
      const t = segTimes(m.settings)[ui.seg];
      if (t[1] - t[0] < 2){ await tell('Dit blok is te kort om te splitsen.'); return; }
      const sug = Math.round((t[0] + t[1]) / 2);
      const v = await askNum(`Op welke minuut wil je een extra wissel? (tussen ${t[0] + 1} en ${t[1] - 1})`, sug);
      if (v === null) return;
      const min = parseInt(v);
      if (!(min > t[0] && min < t[1])){ await tell(`Kies een minuut tussen ${t[0] + 1} en ${t[1] - 1}.`); return; }

      }
      localStorage.setItem(CLOUD_KEY, JSON.stringify({code, id:cid}));
      await cloudStart(); render(); toast('Verbonden ☁️'); break;
    }
    case 'cloudOff': {
      if (!await ask('Dit apparaat loskoppelen? De gegevens blijven online en op dit apparaat staan, maar worden niet meer gedeeld.', 'Loskoppelen')) return;
      localStorage.removeItem(CLOUD_KEY); if (cloud.unsub) cloud.unsub(); cloud.unsub = null; cloud.id = null; cloud.api = null; setCloudStatus('off'); render(); break;
    }
  }
});

const PALETTE = [

  {c:'#ff8a1f', n:'Oranje'}, {c:'#ffc83d', n:'Goud'}, {c:'#14b8a6', n:'Teal'}, {c:'#e8ecf4', n:'Wit'}
];
function onColor(hex){
  const h = String(hex || '#c6ff3d').replace('#', ''); if (h.length < 6) return '#07090f';
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255).map(v => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
  return .2126 * r + .7152 * g + .0722 * b > .35 ? '#07090f' : '#ffffff';
}

function nextTeamColor(){ const used = S.teams.map(t => t.color); return (PALETTE.find(p => !used.includes(p.c)) || PALETTE[S.teams.length % PALETTE.length]).c; }
