        <button class="btn full gbtn" data-r="google"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>Doorgaan met Google</button>
        <div class="ordiv"><span>of met e-mail</span></div>
        ${mode === 'up' ? `<label class="f">Je naam<input id="auName" value="${esc(name)}" placeholder="Voor- en achternaam" autocomplete="name" maxlength="40"></label>` : ''}
        <label class="f">E-mailadres<input id="auMail" type="email" value="${esc(email)}" autocomplete="email" inputmode="email" autocapitalize="off"></label>
        <label class="f">Wachtwoord<input id="auPw" type="password" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}" placeholder="${mode === 'up' ? 'Minstens 6 tekens' : ''}"></label>
        ${msg ? `<div class="aumsg ${ok ? 'ok' : ''}">${esc(msg)}</div>` : ''}
        <button class="btn pri full big" data-r="${mode}">${mode === 'up' ? 'Account maken' : 'Inloggen'}</button>
        <div class="grid2" style="margin-top:8px">
          <button class="btn sm" data-r="${mode === 'up' ? 'toIn' : 'toUp'}">${mode === 'up' ? 'Ik heb al een account' : 'Nieuw account'}</button>
          ${mode === 'in' ? `<button class="btn sm" data-r="reset">Wachtwoord vergeten?</button>` : `<span></span>`}
        </div>
        <button class="btn full" style="margin-top:10px" data-r="no">Annuleren</button></div>`);
      setTimeout(() => (d.querySelector(mode === 'up' ? '#auName' : '#auMail') || {}).focus?.(), 50);
    };
    const finish = ok => { d.remove(); res(ok); setTimeout(() => { try { flushPending(); } catch(_){} }, 0); };
    const busy = on => d.querySelectorAll('button').forEach(b => b.disabled = on);
    d.addEventListener('click', async e => {
      e.stopPropagation();
      const b = e.target.closest('[data-r]'); if (!b) return;
      const r = b.dataset.r;
      if (r === 'no') return finish(false);
      if (r === 'toUp'){ mode = 'up'; return draw(); }
      if (r === 'toIn'){ mode = 'in'; return draw(); }
      const api = await firebaseApi();
      const mail = (d.querySelector('#auMail')?.value || '').trim(), pw = d.querySelector('#auPw')?.value || '', name = (d.querySelector('#auName')?.value || '').trim();
      try {
        if (r === 'no') return finish(false);
        if (r === 'toUp'){ mode = 'up'; return draw(); }
        if (r === 'toIn'){ mode = 'in'; return draw(); }
        if (r === 'reset'){ if (!mail) return draw('Vul eerst je e-mailadres in.'); busy(true); await api.resetPassword(mail); return draw('Je krijgt een e-mail om een nieuw wachtwoord te kiezen. Kijk ook in je spam.', true); }
        if (r === 'google'){ busy(true); await api.signInGoogle(); }
        if (r === 'in'){ if (!mail || !pw) return draw('Vul je e-mailadres en wachtwoord in.'); busy(true); await api.signInEmail(mail, pw); }
        if (r === 'up'){ if (!name) return draw('Vul je naam in.'); if (!mail || !pw) return draw('Vul je e-mailadres en een wachtwoord in.'); busy(true); try { localStorage.setItem(ME_KEY, name); } catch(_){} await api.signUpEmail(mail, pw, name); if (cloud.user) cloud.user.displayName = name; }
        await waitFor(() => myUid() && !cloud.syncing, 15000);
        finish(true);
      } catch(err){ if (err && err.code === 'auth/popup-closed-by-user') return draw(); console.error(err); draw(authMsg(err)); }
    });
    d.addEventListener('keydown', e => { if (e.key === 'Enter') d.querySelector(`[data-r="${mode}"]`)?.click(); });
    document.body.appendChild(d); draw();
  });
}
const waitFor = (fn, ms) => new Promise(res => { const t0 = Date.now(); const tick = () => fn() || Date.now() - t0 > ms ? res() : setTimeout(tick, 100); tick(); });
async function needLogin(why){
  if (myUid()) return true;
  if (!cloudAvailable()){ await tell('Hiervoor moet de online opslag (Firebase) ingesteld zijn.'); return false; }
  if (!cloud.api) await cloudStart();
  return loginDialog(why);
}
async function askName(){
  let n = '';
  while (!n){ const r = await askText('Wat is je naam? Dan zien de andere trainers met wie ze het team delen.', ''); if (r === null) return ''; n = String(r).trim().slice(0, 40); }
  return n;
}
async function changeMyName(){
  const n = await askText('Jouw naam (zo zien de andere trainers je):', myName()); if (!n || !n.trim()) return;
  const name = n.trim().slice(0, 40);
  try { localStorage.setItem(ME_KEY, name); } catch(e){}
  if (cloud.user){ cloud.user.displayName = name; cloud.api.setName(name).catch(() => {}); saveUserTeams(); }
  Object.keys(cloud.links).forEach(afterRemote);
  render();
}
async function logout(){
  if (!await ask('Uitloggen op dit apparaat? Je teams blijven op dit apparaat staan, maar worden niet meer gedeeld tot je weer inlogt.', 'Uitloggen')) return;
  stopAll(); await cloud.api.signOut(); render();
}

// ---------- trainers uitnodigen ----------
const inviteUrl = iid => location.origin + location.pathname + `?uitnodiging=${iid}`;
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const isOwner = tid => { const L = cloud.links[tid]; return !!(L && L.members[myUid()] === 'owner'); };
async function inviteTrainer(t){
  if (!await needLogin('Log in om je team veilig met andere trainers te delen.')) return;
  t = S.teams.find(x => x.id === t.id);
  if (!cloudCfg(t.id) || isLegacy(cloudCfg(t.id))){ try { await createRemoteTeam(t); await saveUserTeams(); save(); listenTeam(t.id); } catch(e){ console.error(e); await tell('Online bewaren lukt niet. Staan de nieuwe Firestore-regels erin? (' + (e.message || e) + ')'); return; } }
  const n = await askText(`Wie nodig je uit voor ${teamLabel(t)}? (naam van de trainer)`, '');
  if (n === null || !n.trim()) return;
  const iid = randId(24), name = n.trim().slice(0, 40);
  try { await cloud.api.inviteCreate(iid, {team: cloudCfg(t.id).id, name, teamLabel: teamLabel(t), club: t.club || '', byName: myName(), by: myUid(), created: Date.now(), usedBy: null}); }
  catch(e){ console.error(e); await tell('Uitnodiging maken lukt niet. (' + (e.message || e) + ')'); return; }
  t = S.teams.find(x => x.id === t.id);
  t.invites = t.invites || []; t.invites.push({id: iid, name, created: Date.now()}); commit();
  sendInvite(t, {id: iid, name});
}
function sendInvite(t, inv){
  const url = inviteUrl(inv.id);
  const txt = `⚽ Hoi ${inv.name}! Ik deel ${teamLabel(t)} met je in LineUp, dan kunnen we samen de opstellingen maken. Open deze link om mee te doen: ${url}`;
  if (navigator.share) navigator.share({title: 'LineUp – ' + teamLabel(t), text: txt}).catch(() => {});
  else navigator.clipboard?.writeText(txt).then(() => toast('Uitnodiging gekopieerd – plak hem in WhatsApp'), () => tell(url));
}
async function cancelInvite(t, iid){
  const inv = (t.invites || []).find(x => x.id === iid); if (!inv) return;
  if (!await ask(`Uitnodiging voor ${inv.name} intrekken? De link werkt dan niet meer.`, 'Intrekken')) return;
  cloud.api.inviteDelete(iid).catch(e => console.error(e));
  t.invites = t.invites.filter(x => x.id !== iid); commit();
}
async function removeMember(t, uid){
  const c = cloudCfg(t.id), name = ((t.people || {})[uid] || {}).name || 'Deze trainer';
  if (!await ask(`${name} verwijderen uit ${teamLabel(t)}? Hij kan het team dan niet meer zien of wijzigen.`, 'Verwijderen')) return;
  try { await cloud.api.teamRemoveMember(c.id, uid); } catch(e){ await tell('Verwijderen lukt niet. (' + (e.message || e) + ')'); return; }
  if (t.people) delete t.people[uid]; commit();
}
async function leaveTeam(t){
  if (!await ask(`${teamLabel(t)} verlaten? Het team blijft op dit apparaat staan, maar je kunt niet meer samen met de andere trainers werken.`, 'Verlaten')) return;
  const c = cloudCfg(t.id);
  try { await cloud.api.teamRemoveMember(c.id, myUid()); } catch(e){ console.error(e); }
  unlinkLive(t.id); const map = cloudMap(); delete map[t.id]; setCloudMap(map);
  cloud.api.userRemoveTeam(myUid(), c.id).catch(() => {});
  if (t.people) delete t.people[myUid()];
  save(); setCloudStatus(); render();
}
async function joinRemote(rid, iid, replaceTid){
  const uid = myUid(), api = cloud.api;
  let r = await api.teamGet(rid).catch(() => null);
  if (!r){
    const inv = await api.inviteGet(iid).catch(() => null);
    if (!inv || inv.team !== rid) throw new Error('Deze uitnodiging werkt niet (meer). Vraag de trainer om een nieuwe link.');
    if (!inv.multi){
      if (inv.usedBy && inv.usedBy !== uid) throw new Error('Deze uitnodiging is al door iemand anders gebruikt. Vraag de trainer om een nieuwe link.');
      if (!inv.usedBy) await api.inviteClaim(iid, uid, myName());
    }
    await api.teamJoin(rid, uid, iid);
    r = await api.teamGet(rid);
  }
  const td = teamFromRemote(r, null); if (!td) throw new Error('Dit team kon niet geladen worden.');
  td.people = td.people || {}; td.people[uid] = {name: myName() || 'Trainer', joined: Date.now()};
  td.invites = (td.invites || []).filter(x => x.id !== iid);
  let tid;
  if (replaceTid && S.teams.some(t => t.id === replaceTid)){
    tid = replaceTid; S.teams[S.teams.findIndex(t => t.id === tid)] = {...td, id: tid};
    const map = cloudMap(); map[tid] = {id: rid, v: 7}; setCloudMap(map); normalize();
  } else tid = placeTeam(td, rid);
  await saveUserTeams();
  save();
  listenTeam(tid);
  cloudPushTeam(tid, true);
  return tid;
}
async function openInvite(iid){
  if (!cloudAvailable()){ await tell('Deze app is nog niet gekoppeld aan de online opslag.'); return; }
  const api = await firebaseApi();
  const inv = await api.inviteGet(iid).catch(() => null);
  if (!inv){ await tell('Deze uitnodiging werkt niet (meer). Vraag de trainer om een nieuwe link.'); return; }
  const have = Object.keys(cloudMap()).find(k => cloudMap()[k].id === inv.team && S.teams.some(t => t.id === k));
  if (have){ S.active.team = have; ui.tab = 'matches'; commit(); toast(`${teamLabel(team())} staat al in je app`); return; }
  if (!await inviteSheet(inv, inviteUrl(iid))) return;
  if (!await needLogin(`Log in of maak een account om mee te doen met ${inv.teamLabel || 'het team'}. Daarna staat het team ook op je andere telefoons zodra je daar inlogt.`)) return;
  try {
    const tid = await joinRemote(inv.team, iid);
    S.active.team = tid; ui.tab = 'matches'; ui.matchId = null; commit(); window.scrollTo(0, 0);
    toast(`${teamLabel(team())} toegevoegd ☁️`);
  } catch(e){ console.error(e); await tell(e.message && !/permission/i.test(e.message) ? e.message : 'Meedoen lukt niet. Deze uitnodiging is misschien ingetrokken of verlopen. Vraag de trainer om een nieuwe link.'); }
}
async function openLegacyInvite(cid){
  const api = await firebaseApi(); const r = await api.get(cid).catch(() => null);
  if (r && r.kind === 'moved' && r.invite) return openInvite(r.invite);
  await tell('Deze uitnodigingslink is van een oudere versie. Vraag de trainer om een nieuwe link.');
}
function parseInvite(text){
  try {
    const u = new URL(String(text).trim().match(/https?:\/\/\S+/)?.[0] || String(text).trim());
    const iid = u.searchParams.get('uitnodiging'); if (iid) return {iid};
    const cid = u.searchParams.get('team'); if (cid && /^[0-9a-f]{64}$/.test(cid)) return {cid};
  } catch(e){}
  return null;
}
async function pasteInvite(){
  const r = await askText('Plak hier de uitnodigingslink die je via WhatsApp hebt gekregen.', '');
  if (r === null) return;
  const p = parseInvite(r);
  if (!p){ await tell('Dit is geen geldige uitnodigingslink. Kopieer de hele link uit het bericht (houd de link ingedrukt → Kopieer).'); return; }
  if (p.iid) await openInvite(p.iid); else await openLegacyInvite(p.cid);
}

  const st = cloud.outdated ? 'old' : (L ? L.status : 'busy');
  const members = L ? L.members : {}, people = t.people || {}, owner = isOwner(t.id);
  const ids = Object.keys(members).sort((a, b) => (members[b] === 'owner') - (members[a] === 'owner') || (people[a]?.name || '').localeCompare(people[b]?.name || ''));
  return `
  <div class="card">${head}
    <div class="set"><div class="lbl">Online bewaard<small>${owner ? 'Jij beheert dit team' : 'Gedeeld door ' + esc(people[ids.find(x => members[x] === 'owner')]?.name || 'een trainer')}</small></div><b class="cloud ${st}">${{ok:'✓ Opgeslagen', busy:'… Bezig', err:'⚠️ Geen verbinding', old:'⬆️ Ververs de app', off:'—'}[st] || ''}</b></div>
    <div class="sgroup" style="margin-top:14px">Gedeeld met</div>
    <div class="mlist">
      ${ids.map(u => { const me = u === myUid(), p = people[u] || {}; return `<div class="mrow"><span class="mav">${esc((p.name || '?').charAt(0).toUpperCase())}</span><span class="grow"><b>${esc(p.name || 'Trainer')}${me ? ' (jij)' : ''}</b><small>${members[u] === 'owner' ? 'Beheerder' : 'Trainer'}${p.joined ? ' · sinds ' + new Date(p.joined).toLocaleDateString('nl-NL', {day:'numeric', month:'short'}) : ''}</small></span>${owner && !me ? `<button class="x" data-act="removeMember" data-id="${esc(u)}" aria-label="Verwijderen">×</button>` : ''}</div>`; }).join('')}
      ${(t.invites || []).map(iv => `<div class="mrow inv"><span class="mav">${esc((iv.name || '?').charAt(0).toUpperCase())}</span><span class="grow"><b>${esc(iv.name)}</b><small>Uitgenodigd · nog niet meegedaan</small></span><button class="btn sm" data-act="reInvite" data-id="${esc(iv.id)}">📤</button><button class="x" data-act="cancelInvite" data-id="${esc(iv.id)}" aria-label="Intrekken">×</button></div>`).join('')}
    </div>
    <button class="btn pri full" style="margin-top:12px" data-act="inviteTrainer">＋ Trainer uitnodigen (link via WhatsApp)</button>
    ${owner ? '' : `<button class="btn full" style="margin-top:8px" data-act="leaveTeam">Dit team verlaten</button>`}
  </div>`;
}
function loginBanner(){
  if (!cloudAvailable() || !cloud.authKnown || cloud.user) return '';
  const shared = Object.keys(cloudMap()).filter(k => S.teams.some(t => t.id === k));
  if (!shared.length) return '';
  return `<div class="lbanner" data-act="login">🔒 <span><b>Samenwerken is nu beveiligd.</b> Log in om ${esc(shared.map(k => teamLabel(S.teams.find(t => t.id === k))).join(' en '))} weer met de andere trainers te delen.</span><b>Inloggen ›</b></div>`;
}

/* ===================== Slepen ===================== */
const drag = {src:null, ghost:null, active:false, sx:0, sy:0, el:null, hi:null, suppress:false};
function dropTarget(x, y){
  if (drag.ghost) drag.ghost.style.display = 'none';
  const under = document.elementFromPoint(x, y);
  if (drag.ghost) drag.ghost.style.display = '';
  if (!under) return null;
  const f = under.closest('[data-drag="f"]');
  if (f) return {type:'f', i:+f.dataset.i, el:f};
  const b = under.closest('[data-drag="b"]');
  if (b) return {type:'b', id:b.dataset.id, el:b};
  const bz = under.closest('#benchZone');
  if (bz) return {type:'bz', el:bz};
  const pitch = under.closest('#livePitch');
  if (pitch){
    const r = pitch.getBoundingClientRect();
    return {type:'pitch', x:Math.max(6, Math.min(94, (x - r.left) / r.width * 100)), y:Math.max(5, Math.min(95, (y - r.top) / r.height * 100)), el:null};
  }
  return null;
}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button > 0) return;
  if (e.pointerType === 'mouse') e.preventDefault();
  drag.el = el; drag.sx = e.clientX; drag.sy = e.clientY; drag.active = false;
  drag.src = el.dataset.drag === 'f' ? {type:'f', i:+el.dataset.i} : {type:'b', id:el.dataset.id};
});
document.addEventListener('pointermove', e => {
  if (!drag.el) return;
  if (!drag.active){
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
    const m = match();
    drag.active = true; ui.sel = null;
    document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.classList.add('ghost'); drag.ghost.removeAttribute('data-drag'); drag.ghost.removeAttribute('data-act');
    document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');
  }
  e.preventDefault();
  if (e.clientY < 90) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 110) window.scrollBy(0, 14);
  drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
  const t = dropTarget(e.clientX, e.clientY);
  const hiEl = t && t.el && t.el !== drag.el ? t.el : null;
  if (drag.hi !== hiEl){ drag.hi && drag.hi.classList.remove('drop-hi'); hiEl && hiEl.classList.add('drop-hi'); drag.hi = hiEl; }
}, {passive:false});
function endDrag(e, cancel){
  if (!drag.el) return;
  const wasActive = drag.active, src = drag.src;
  drag.hi && drag.hi.classList.remove('drop-hi');
  const t = wasActive && !cancel ? dropTarget(e.clientX, e.clientY) : null;
  drag.ghost && drag.ghost.remove();
  drag.el.classList.remove('dragging');
  drag.el = null; drag.ghost = null; drag.active = false; drag.hi = null;
  if (!wasActive) return;
  drag.suppress = true; setTimeout(() => drag.suppress = false, 400);
  const m = match(); if (!m || !m.segments || !t) { render(); return; }
  const lu = m.segments[ui.seg];
  if (t.type === 'pitch'){
    if (src.type === 'f'){ m.posOverride = m.posOverride || {}; m.posOverride[src.i] = {x:t.x, y:t.y}; }
    else {
      // bankspeler op het veld losgelaten: naar dichtstbijzijnde lege plek
      const pos = matchPositions(m);
      let best = -1, bd = 1e9;
      pos.forEach((p, i) => { if (lu[i]) return; const d = Math.hypot(p.x - t.x, p.y - t.y); if (d < bd){ bd = d; best = i; } });
      if (best >= 0) lu[best] = src.id; else { toast('Sleep op een speler om te wisselen'); render(); return; }
    }
  } else if (t.type === 'f' && src.type === 'f' && t.i === src.i){ render(); return; }
  else if (t.type === 'b' && src.type === 'b'){ render(); return; }
  else if (t.type === 'bz' && src.type === 'b'){ render(); return; }
  else swap(m, src, t);
  m.edited = true; save(); render();
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));

function shareMatch(m){
  const pos = matchPositions(m), times = segTimes(m.settings);
  let txt = `⚽ ${matchTitle(m)}${m.date ? ' (' + fmtDate(m.date, {}) + ')' : ''}\nFormatie ${m.settings.formation}\n`;
  m.segments.forEach((lu, s) => {
    txt += `\n${blockLabel(m, s)} (${times[s][0]}'–${times[s][1]}')\n`;
    pos.forEach((p, i) => { if (lu[i]) txt += `${p.line === 'K' ? '🧤 Kieper' : p.code}: ${pname(lu[i])}\n`; });
    const b = benchIds(m, s); if (b.length) txt += `Bank: ${b.map(pname).join(', ')}\n`;
  });
  if (navigator.share) navigator.share({title:matchTitle(m), text:txt}).catch(() => {});
  else navigator.clipboard?.writeText(txt).then(() => toast('Gekopieerd naar klembord'), () => alert(txt));
}
function buildPrint(m){
  const times = segTimes(m.settings), stt = stats(m);
  document.getElementById('print').innerHTML = iconize(`
    <div style="display:flex;align-items:center;gap:12px">${logoSrc ? `<img src="${logoSrc}" style="width:54px;height:54px;object-fit:contain">` : ''}<div><div style="font-weight:800;letter-spacing:.1em;color:#555;text-transform:uppercase">${esc(team().club || '')}</div><h2>${esc(matchTitle(m))}</h2></div></div>
    <div>${m.date ? fmtDate(m.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : ''} · ${settingsLine(m.settings)}</div>
    <div class="pg">${m.segments.map((lu, s) => `<div class="seg"><b>${blockLabel(m, s)} · ${times[s][0]}'–${times[s][1]}'</b>${pitchHTML(m, s, false)}<div style="font-size:12px;margin-top:4px">Bank: ${benchIds(m, s).map(id => esc(pname(id))).join(', ') || '–'}</div></div>`).join('')}</div>
    <table><tr><th>Speler</th>${times.map((t, i) => `<th>${blockLabel(m, i)}</th>`).join('')}<th>Minuten</th></tr>
    ${Object.entries(stt).map(([id, r]) => `<tr><td style="text-align:left">${esc(pname(id))}</td>${r.per.map(c => `<td>${c || 'W'}</td>`).join('')}<td>${Math.round(r.mins)}'</td></tr>`).join('')}</table>`);
}

if (!S.active.team) S.active.team = S.teams[0].id;
const SURVEY_ID = new URLSearchParams(location.search).get('vraag') || (new URLSearchParams(location.search).get('wie') ? 'wie' : null);
const WIE_ID = new URLSearchParams(location.search).get('wie');
if (WIE_ID) bootWie(WIE_ID); else if (SURVEY_ID) bootSurvey(SURVEY_ID); else render();
document.getElementById('nav').innerHTML = iconize(document.getElementById('nav').innerHTML);
if (!SURVEY_ID){
  loadLogo();
  const qp = new URLSearchParams(location.search), iv = qp.get('uitnodiging'), jc = qp.get('team');
  cloudStart().then(() => {
    if (iv || jc){ history.replaceState(null, '', location.pathname); if (iv) openInvite(iv); else openLegacyInvite(jc); }
  });
}
