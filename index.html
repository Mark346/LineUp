<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LineUp">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="LineUp">
<link rel="manifest" href="manifest.webmanifest?v=6">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=6">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png?v=6">
<meta name="theme-color" content="#0f6b35">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@500;600;700;800;900&family=Roboto+Slab:wght@700;800;900&display=swap" rel="stylesheet">
<title>LineUp</title>
<style>
  /* ===================== Thema's ===================== */
  :root, body[data-theme="neon"]{
    --bg:#07090f; --bg2:radial-gradient(1200px 600px at 10% -10%, rgba(198,255,61,.10), transparent 60%), radial-gradient(900px 500px at 110% 10%, rgba(34,211,238,.10), transparent 60%);
    --surf:rgba(255,255,255,.045); --surf2:rgba(255,255,255,.07); --solid:#11151f; --line:rgba(255,255,255,.09);
    --txt:#f3f6fb; --muted:#8b94a8; --acc:#c6ff3d; --acc2:#22d3ee; --on-acc:#07090f;
    --hdr:linear-gradient(135deg,#0d1220 0%,#0a0f1a 60%); --hdr-txt:#fff; --hdr-glow:0 0 40px rgba(198,255,61,.25);
    --pitch1:#0f3b2a; --pitch2:#124431; --pline:rgba(198,255,61,.35); --kp:#22d3ee;
    --ok:#3ee08f; --red:#ff4d6d; --shadow:0 10px 30px rgba(0,0,0,.35); --blur:blur(14px); --radius:20px;
    color-scheme:dark;
  }



  :root{ --team:#c8102e; --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --disp:"Archivo","Inter",-apple-system,sans-serif; }

  /* ===================== Basis ===================== */
  body{--soft:color-mix(in srgb,var(--acc) 16%,transparent)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px}
  body{background:var(--bg2),var(--bg);background-attachment:fixed;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  h1,h2,.mt,.bigscore,.tile b,.brand .app{font-family:var(--disp);letter-spacing:-.02em}
  a{color:var(--acc)}
  select,input,textarea{font:inherit;color:var(--txt);background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
  select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
  select option{color:#111}
  main{padding:14px;max-width:760px;margin:0 auto}
  .muted{color:var(--muted);font-size:13px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f,div.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}div.f>span{margin-bottom:4px}
  label.f>*{margin-top:5px}
  details summary{cursor:pointer;font-weight:700;list-style:none}
  details summary::-webkit-details-marker{display:none}

  /* ===================== Kop ===================== */
  header{position:relative;z-index:20;color:var(--hdr-txt);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:var(--hdr);box-shadow:var(--hdr-glow);border-bottom:1px solid var(--line);overflow:hidden}
  body[data-theme="neon"] header::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;max-width:760px;margin-left:auto;margin-right:auto}
  .logo{width:46px;height:46px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.25);overflow:hidden}
  .logo img{width:84%;height:84%;object-fit:contain}
  .brand .club{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;opacity:.85}
  .brand .club:empty{display:none}
  .brand .app{font-size:21px;font-weight:900;line-height:1.05}
  body[data-theme="neon"] .brand .app{background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
  .teams{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;max-width:760px;margin:0 auto;scrollbar-width:none}
  .teams::-webkit-scrollbar{display:none}
  header .pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:var(--hdr-txt)}
  header .pill.on{background:#fff;color:#111;border-color:#fff}
  body[data-theme="neon"] header .pill.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);box-shadow:0 0 18px rgba(198,255,61,.45)}
  .cloud{font-size:12px;font-weight:800;margin-left:auto;background:rgba(255,255,255,.14);padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .cloud:empty{display:none}

  /* ===================== Bouwstenen ===================== */
  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  .card h2{font-size:17px;margin:0 0 12px;font-weight:800}
  .pill{border:1px solid var(--line);background:var(--surf2);color:var(--txt);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer;font-family:inherit}
  .pill.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--surf2);color:var(--txt);border:1px solid var(--line);transition:transform .08s, filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2)));color:var(--on-acc);border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 35%,transparent)}
  .btn.pri2{border:2px solid var(--acc);color:var(--acc);background:transparent}
  .btn.red{background:transparent;color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
  .btn.sm{padding:8px 11px;font-size:14px;border-radius:12px}
  .btn.full{width:100%}
  .btn.big{padding:17px;font-size:18px;margin-bottom:10px;border-radius:18px}
  .btn[disabled]{opacity:.45}
  .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
  .num{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
  .tags{display:flex;gap:4px}
  .tag{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;cursor:pointer}
  .tag.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
  .list .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .list .item:last-child{border-bottom:0}
  .item .grow{flex:1;min-width:0}
  .item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .match{cursor:pointer}
  .badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--surf2);color:var(--muted);white-space:nowrap}
  .badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .badge.live{background:var(--soft);color:var(--acc)}
  .empty{text-align:center;padding:26px 10px;color:var(--muted)}
  .empty b{display:block;font-size:36px;margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

  /* ===================== Navigatie ===================== */
  nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:520px;margin:0 auto;z-index:30;display:flex;background:color-mix(in srgb,var(--solid) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.28);padding:6px}
  nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:16px}
  nav button b{font-size:20px;font-weight:400}
  nav button.on{color:var(--on-acc);background:var(--acc)}

  /* ===================== Stepper / segmented ===================== */
  .set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .set:last-child{border-bottom:0}
  .set .lbl{font-weight:700;font-size:15px}
  .set .lbl small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .step{display:flex;align-items:center;background:var(--surf2);border:1px solid var(--line);border-radius:14px;flex:none}
  .step button{width:44px;height:44px;border:0;background:none;color:var(--acc);font-size:24px;font-weight:800;cursor:pointer}
  .step b{min-width:34px;text-align:center;font-size:19px}
  .segc{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:6px}
  .segc button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:800;padding:10px 4px;border-radius:10px;cursor:pointer}
  .segc button.on{background:var(--acc);color:var(--on-acc)}
  .stabs{display:flex;gap:4px;background:color-mix(in srgb,var(--solid) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px;position:sticky;top:8px;z-index:15;box-shadow:var(--shadow)}
  .stabs button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:10px 2px;border-radius:12px;cursor:pointer}
  .stabs button.on{background:var(--acc);color:var(--on-acc)}
  .summary{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin-bottom:12px;font-size:13px;color:var(--muted);cursor:pointer}
  .summary b{color:var(--txt)} .summary span{color:var(--acc);font-weight:800;white-space:nowrap}

  /* ===================== Fasebalk ===================== */
  .phases{position:sticky;top:0;z-index:25;display:grid;grid-template-columns:34px repeat(4,1fr);gap:4px;margin:-14px -14px 12px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:color-mix(in srgb,var(--solid) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .phases button{border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:9px 2px;border-radius:12px;cursor:pointer;line-height:1.25}
  .phases button.past{color:var(--ok)}
  .phases button.on{background:var(--acc);color:var(--on-acc)}
  .phases .pback{font-size:24px;color:var(--txt);padding:4px 0}

  /* ===================== Wedstrijd ===================== */
  .mhead{position:relative;overflow:hidden}
  .mhead .mt{font-size:23px;font-weight:900;line-height:1.1}
  .mhead .club{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--acc);margin-bottom:3px}
  .bigscore{font-size:52px;font-weight:900;text-align:center;margin-top:8px;letter-spacing:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .segs{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .segs .pill{width:100%;text-align:left;font-size:15px;padding:11px 14px;border-radius:14px;display:flex;justify-content:space-between}
  .pill.now:not(.on){border-color:var(--acc);color:var(--acc)}
  .wissel{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tools .btn{flex:1 1 auto}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

  /* ===================== Veld ===================== */
  .pitch{position:relative;width:100%;aspect-ratio:68/90;border-radius:18px;overflow:hidden;background:repeating-linear-gradient(0deg,var(--pitch1) 0 10%,var(--pitch2) 10% 20%);border:1px solid var(--line);box-shadow:inset 0 0 60px rgba(0,0,0,.25)}
  .pitch,.bench{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .pitch .ln{position:absolute;border:2px solid var(--pline)}
  .pitch .mid{left:0;right:0;top:50%;border-width:2px 0 0}
  .pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
  .pitch .box{left:22%;right:22%;height:14%}
  .pitch .box.t{top:-2px}.pitch .box.b{bottom:-2px}
  .pitch .goal{left:40%;right:40%;height:4%}
  .pitch .goal.t{top:-2px}.pitch .goal.b{bottom:-2px}
  .pitch .wm{position:absolute;left:50%;top:50%;width:22%;transform:translate(-50%,-50%);opacity:.18;pointer-events:none}
  .pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:84px;cursor:pointer;user-select:none;touch-action:none}
  .pl .dot{position:relative;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));color:var(--on-acc);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.9)}
  body[data-theme="neon"] .pl .dot{box-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent),0 0 0 2px rgba(0,0,0,.4)}
  .pl.k .dot{background:linear-gradient(145deg,#1e2433,#0b0e16);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 2px var(--kp)}
  .pl.emptyp .dot{background:rgba(0,0,0,.25);color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6);border:2px dashed transparent}
  .pl .nm{color:#fff;margin-top:4px;font-size:12px;font-weight:800;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:2px 7px;border-radius:999px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pl.emptyp .nm{opacity:.75;font-weight:600}
  .pl .mb{position:absolute;top:-7px;right:-13px;background:#fff;color:#111;font-style:normal;font-size:10px;font-weight:900;padding:0 5px;border-radius:999px;line-height:1.5;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pitch.lg .pl .dot{width:48px;height:48px;font-size:13px}
  .pitch.lg .pl .nm{font-size:13px}
  .pitch.sm .pl{width:74px}
  .pitch.sm .pl .dot{width:36px;height:36px;font-size:11px}
  .pitch.sm .pl .nm{font-size:11px;max-width:74px}
  .pl.sel .dot,.benchp.sel{outline:3px solid #fff;outline-offset:3px;animation:pulse 1s infinite}
  @keyframes pulse{50%{outline-color:var(--acc)}}

  /* ===================== Bank ===================== */
  .benchtitle{margin-top:16px;font-weight:900;font-size:17px;font-family:var(--disp)}
  .benchtitle span{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;font-family:var(--font)}
  .bench{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  #benchZone{min-height:48px;border-radius:14px;padding:4px}
  .benchp{display:flex;align-items:center;gap:8px;padding:6px 13px 6px 6px;font-size:16px;font-weight:800;border-radius:999px;border:1px solid var(--line);background:var(--surf2);cursor:pointer;touch-action:none}
  .benchp .bd{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--acc),var(--acc2));color:var(--on-acc);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none}
  .benchp i{font-style:normal;color:var(--muted);font-size:13px}
  .benchp.low{border-color:var(--acc);background:var(--soft)}
  .benchp.low i{color:var(--acc);font-weight:900}
  .ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);opacity:.95}
  .dragging{opacity:.35}
  .drop-hi .dot,.drop-hi.benchp,#benchZone.drop-hi{outline:3px dashed var(--acc);outline-offset:3px}

  /* ===================== Tabellen & statistiek ===================== */
  table.ov{width:100%;border-collapse:collapse;font-size:13px}
  table.ov th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  table.ov th,table.ov td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
  table.ov td:first-child,table.ov th:first-child{text-align:left}
  table.ov .w{color:var(--muted)}
  table.ov .kp{color:var(--kp);font-weight:800}
  table.ov .cur{background:var(--soft)}
  .bar{height:6px;background:var(--surf2);border-radius:999px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .tile{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
  .tile b{display:block;font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tile span{font-size:12px;color:var(--muted)}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sc{background:var(--surf2);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .scl{font-weight:800;text-align:center}
  .sc .step b{font-size:28px;min-width:44px}

  /* ===================== Aanwezig, teams, modals ===================== */
  .who{display:flex;flex-wrap:wrap;gap:8px}
  .whop{border:1px solid var(--line);background:var(--surf2);color:var(--muted);border-radius:14px;padding:10px 13px;font:inherit;font-size:16px;font-weight:800;cursor:pointer;text-decoration:line-through;opacity:.7}
  .whop.on{border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--txt);text-decoration:none;opacity:1}
  .whop small{font-size:11px;background:var(--acc);color:var(--on-acc);border-radius:6px;padding:1px 5px;margin-left:3px}
  .tcard{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--surf2)}
  .tcard.on{border:2px solid var(--acc);background:var(--soft)}
  .card .cloud{background:none;margin:0}
  .card .cloud.ok{color:var(--ok)} .card .cloud.err{color:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .modal .box{background:var(--solid);color:var(--txt);border:1px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.45);max-height:85vh;overflow:auto}
  .modal p{margin:0 0 14px;font-size:17px;font-weight:700}
  .subrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:6px}
  .subrow select{padding:10px 6px;font-size:15px}
  #outdated{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:300;background:var(--acc);color:var(--on-acc);padding:14px;border-radius:16px;font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
  .diag{margin-top:10px;background:color-mix(in srgb,#f3b52a 16%,transparent);border:1px solid color-mix(in srgb,#f3b52a 50%,transparent);border-radius:12px;padding:10px;font-size:13px}
  .chk{display:flex;flex-wrap:wrap;gap:6px}
  .gk{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:6px 9px;font-size:13px;font-weight:700}

  const L = f.l.length, yTop = 14, yBot = keeper ? 67 : 76;
  f.l.forEach((c, i) => {
    const line = L === 1 ? 'M' : i === 0 ? 'V' : i === L - 1 ? 'A' : 'M';
    const y = L === 1 ? 50 : yBot - i * (yBot - yTop) / (L - 1);
    const m = c >= 5 ? 10 : c === 4 ? 13 : c === 3 ? 18 : 28;
    let codes = CODES[line][c] || Array(c).fill(line);

    order.forEach(id => {
      const i = lu.indexOf(id);
      if (i >= 0){ mins[id] += times[s][1] - times[s][0]; playedCodes[id].add(pos[i].code); benchedLast[id] = false; }
      else benchedLast[id] = true;
    });
    prev = lu;
  });
  const segs = keep;
  for (let s = from; s < nSeg; s++){
    const segLen = times[s][1] - times[s][0];
    const lineup = Array(pos.length).fill(null);
    const here = order.filter(id => avail(m, id, s));
    let chosen = here.map((id, i) => ({id, i}))
      .sort((a, b) => (mins[a.id] - mins[b.id]) || ((benchedLast[b.id] ? 1 : 0) - (benchedLast[a.id] ? 1 : 0)) || (a.i - b.i))
      .slice(0, pos.length).map(o => o.id);
    if (usePos() && pos[0].line === 'K' && !chosen.some(canKeep)){
      const k = here.filter(id => canKeep(id) && !chosen.includes(id)).sort((a, b) => mins[a] - mins[b])[0];
      if (k && chosen.length) chosen[chosen.length - 1] = k;
    }
    if (usePos()){
      const pairs = [];
      chosen.forEach(id => pos.forEach((P, i) => pairs.push({id, i, sc: prefScore(player(id), P) + (prev && prev[i] === id ? 4 : 0) + (playedCodes[id].has(P.code) ? 0 : .5)})));
      pairs.sort((a, b) => b.sc - a.sc);
      const used = new Set();
      pairs.forEach(x => { if (lineup[x.i] === null && !used.has(x.id)){ lineup[x.i] = x.id; used.add(x.id); } });
      // verbeteren door twee spelers van plek te laten ruilen zolang dat beter past
      const scoreAt = (id, i) => id ? prefScore(player(id), pos[i]) + (prev && prev[i] === id ? 4 : 0) : 0;
      for (let round = 0, better = true; better && round < 20; round++){
        better = false;
        for (let a = 0; a < lineup.length; a++) for (let b = a + 1; b < lineup.length; b++){
          const now = scoreAt(lineup[a], a) + scoreAt(lineup[b], b), swapped = scoreAt(lineup[b], a) + scoreAt(lineup[a], b);
          if (swapped > now){ [lineup[a], lineup[b]] = [lineup[b], lineup[a]]; better = true; }
        }
      }
    } else {
    const rest = [];
    chosen.forEach(id => {
      const pi = prev ? prev.indexOf(id) : -1;
      if (pi >= 0 && lineup[pi] === null){ lineup[pi] = id; return; }
      rest.push(id);
    });
    rest.forEach(id => {
      let best = -1, bestScore = -99;
      lineup.forEach((v, i) => {
        if (v !== null) return;
        const sc = playedCodes[id].has(pos[i].code) ? 0 : 1;
        if (sc > bestScore){ bestScore = sc; best = i; }
      });
      if (best >= 0) lineup[best] = id;
    });
    }
    order.forEach(id => {
      const i = lineup.indexOf(id);
      if (i >= 0){ mins[id] += segLen; playedCodes[id].add(pos[i].code); benchedLast[id] = false; }
      else benchedLast[id] = true;
    });
    segs.push(lineup);
    prev = lineup;
  }
  m.segments = segs;
}
// Lege plekken vanaf blok 'from' opvullen met de reserve die het minst gespeeld heeft
function fillHoles(m, from){
  const times = segTimes(m.settings);
  for (let s = from; s < m.segments.length; s++){
    const lu = m.segments[s];
    if (isEmptySeg(lu)) continue; // nog niet ingevulde blokken met rust laten
    lu.forEach((x, i) => {
      if (x) return;
      const up = playedUpTo(m, s - 1);
      const P = matchPositions(m)[i];
      const b = benchIds(m, s).sort((a, c) => ((up[a] || 0) - (up[c] || 0)) || (usePos() ? prefScore(player(c), P) - prefScore(player(a), P) : 0))[0];
      if (b) lu[i] = b;
    });
  }
}

function stats(m){
  const pos = matchPositions(m), times = segTimes(m.settings), res = {};
  m.present.filter(id => player(id)).forEach(id => res[id] = {mins:0, per:[]});
  (m.segments || []).forEach((lu, s) => {
    const len = times[s][1] - times[s][0];
    Object.keys(res).forEach(id => {
      const i = lu.indexOf(id);
      res[id].per.push(i >= 0 ? pos[i].code : null);
      if (i >= 0) res[id].mins += len;
    });
  });
  return res;
}

  let body;

  else body = `${doneCard}${minutesCard}${lineupCard}

  const fs = ph === 'live' ? fontLevel() : 0;
  return `<div class="fsz fs${fs}${fs === 3 ? ' fs2' : ''}">

}

const FS_KEY = 'opstellingmaker.fs';
const fontLevel = () => { const v = +localStorage.getItem(FS_KEY); return [1, 2, 3].includes(v) ? v : 0; };
function listCard(m, times, cur, last){
  const s = ui.seg, lu = m.segments[s], pos = matchPositions(m);
  const rows = pos.map((p, i) => ({p, id: lu[i]})).sort((a, b) => (b.p.y - a.p.y) || (a.p.x - b.p.x));
  const bench = benchIds(m, s);
  let wissel = '';
  if (s > 0){
    const prev = m.segments[s - 1];
    const ins = lu.filter(id => id && !prev.includes(id)), outs = prev.filter(id => id && !lu.includes(id));
    if (ins.length || outs.length) wissel = `<div class="hcw"><div><b class="out">ERUIT</b>${outs.map(id => esc(pname(id))).join(', ') || '–'}</div><div><b class="in">ERIN</b>${ins.map(id => esc(pname(id))).join(', ') || '–'}</div></div>`;
  }
  return `
  <div class="card hc">
    <div class="hcnav">
      <button class="hcarrow" data-act="seg" data-i="${Math.max(0, s - 1)}" ${s === 0 ? 'disabled' : ''} aria-label="Vorig blok">‹</button>
      <div class="hcblk"><b>${esc(blockLabel(m, s))}</b><span>${times[s][0]}'–${times[s][1]}'${s === cur ? ' · nu' : s > cur ? ' · straks' : ' · geweest'}</span></div>
      <button class="hcarrow" data-act="seg" data-i="${Math.min(last, s + 1)}" ${s === last ? 'disabled' : ''} aria-label="Volgend blok">›</button>
    </div>
    ${wissel}
    <div class="hclist">${rows.map(r => `<div class="hcrow"><span class="hcpos">${r.p.line === 'K' ? 'K' : esc(r.p.code)}</span><span class="hcnm">${r.id ? esc(pname(r.id)) : '—'}</span></div>`).join('')}</div>
    <div class="hcbank"><span>BANK</span><b>${bench.map(id => esc(pname(id))).join(' · ') || '–'}</b></div>
    ${cur < last
      ? `<button class="btn hcbtn" data-act="nextSeg">Wissel doorvoeren (${times[cur + 1][0]}')</button>`
      : `<button class="btn hcbtn" data-act="phase" data-v="post">Wedstrijd afgelopen</button>`}
  </div>`;
}
function fontDialog(){
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    const cur = fontLevel();
    const opts = [[0, 'Normaal', 18], [1, 'Groot', 26], [2, 'Extra groot', 34], [3, 'Lijst · hoog contrast', 30]];
    d.innerHTML = iconize(`<div class="box"><p>Lettergrootte tijdens de wedstrijd</p>
      <div class="muted" style="margin:-4px 0 12px">Handig als je zonder bril langs de lijn staat. Je keuze blijft bewaard op deze telefoon.</div>
      <div class="fsopts">${opts.map(([v, n, px]) => `<button class="${v === cur ? 'on' : ''}" data-r="${v}"><b style="font-size:${px}px">Aa</b><span>${n}</span></button>`).join('')}</div>
      <button class="btn full" style="margin-top:12px" data-r="no">Sluiten</button></div>`);
    document.body.appendChild(d);
    d.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('[data-r]'); if (!b && e.target !== d) return;
      const r = b ? b.dataset.r : 'no';
      if (r !== 'no'){ try { localStorage.setItem(FS_KEY, r); } catch(_){} }
      d.remove(); res(r !== 'no'); setTimeout(() => { try { flushPending(); } catch(_){} }, 0);
    });
  });
}

function viewStats(){
  const se = season(), t = team();
  const done = se.matches.filter(m => m.phase === 'done' && m.segments);
  const rows = {};
  se.players.forEach(p => rows[p.id] = {p, matches:0, mins:0, possible:0, kmins:0, bench:0, blocks:0, pos:{}, goals:0});
  let w = 0, d = 0, l = 0, gf = 0, ga = 0, scored = 0;
  done.forEach(m => {
    const pos = matchPositions(m), times = segTimes(m.settings);
    m.present.forEach(id => {
      const r = rows[id]; if (!r) return;
      r.goals += (m.goals || {})[id] || 0;
      r.matches++; r.possible += m.settings.matchMinutes;
      m.segments.forEach((lu, s) => {
        const len = times[s][1] - times[s][0], i = lu.indexOf(id);
        r.blocks++;
        if (i >= 0){ r.mins += len; const c = pos[i].code; r.pos[c] = (r.pos[c] || 0) + 1; if (pos[i].line === 'K') r.kmins += len; }
        else r.bench++;
      });
    });
    if (hasScore(m)){
      const a = +m.goalsFor, b = +m.goalsAgainst;
      scored++; gf += a; ga += b; a > b ? w++ : a === b ? d++ : l++;
    }
  });
  const list = Object.values(rows).sort((a, b) => b.mins - a.mins);
  const maxMin = Math.max(1, ...list.map(r => r.mins));
  const keepers = list.filter(r => r.kmins > 0).sort((a, b) => b.kmins - a.kmins);
  const pct = r => r.possible ? Math.round(r.mins / r.possible * 100) : 0;
  const avgPct = (() => { const a = list.filter(r => r.possible); return a.length ? Math.round(a.reduce((s, r) => s + pct(r), 0) / a.length) : 0; })();

  if (!done.length) return `<div class="card empty"><b>📊</b>Nog geen statistieken voor ${esc(t.name)} ${esc(se.name)}.<br>Statistieken tellen mee zodra een wedstrijd is opgeslagen als ✅ gespeeld.</div>`;
  return `
  <div class="tiles">
    <div class="tile"><b>${done.length}</b><span>wedstrijden</span></div>
    <div class="tile"><b>${scored ? `${w}-${d}-${l}` : '–'}</b><span>W-G-V</span></div>
    <div class="tile"><b>${scored ? `${gf}:${ga}` : '–'}</b><span>doelpunten</span></div>
  </div>
  <div class="card">
    <h2>⏱️ Speeltijd per speler</h2>
    <div class="muted" style="margin-bottom:8px">% = deel van de minuten in wedstrijden waarbij de speler aanwezig was. Gemiddeld ${avgPct}%.</div>
    <table class="ov">
      <tr><th>Speler</th><th>Wed</th><th>Min</th><th>%</th><th>⚽</th><th>🧤</th><th>Bank</th></tr>
      ${list.map(r => {
        const top = Object.entries(r.pos).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c]) => c === 'K' ? '🧤' : c).join(' · ');
        return `<tr>
          <td>${esc(pshort(r.p))}<div class="bar"><i style="width:${Math.round(r.mins / maxMin * 100)}%"></i></div>${top ? `<div class="muted" style="font-size:11px;margin-top:2px">${top}</div>` : ''}</td>
          <td>${r.matches}</td><td><b>${Math.round(r.mins)}'</b></td>
          <td style="color:${pct(r) < avgPct - 10 ? 'var(--red)' : 'inherit'}">${r.possible ? pct(r) + '%' : '–'}</td>
          <td><b>${r.goals || ''}</b></td><td class="kp">${r.kmins ? Math.round(r.kmins) + "'" : ''}</td><td class="w">${r.bench}×</td></tr>`;
      }).join('')}
    </table>
    <div class="muted" style="margin-top:8px">Bank = aantal blokken op de bank. Rood = duidelijk minder speeltijd dan gemiddeld.</div>
  </div>
  ${list.some(r => r.goals) ? `<div class="card">
    <h2>⚽ Topscorers</h2>
    ${list.filter(r => r.goals).sort((a, b) => b.goals - a.goals).map(r => `<div class="set"><div class="lbl">${esc(pshort(r.p))}</div><b>${r.goals}</b></div>`).join('')}
  </div>` : ''}
  ${keepers.length ? `<div class="card">
    <h2>🧤 In de goal dit seizoen</h2>
    ${keepers.map(r => `<div class="set"><div class="lbl">${esc(pshort(r.p))}</div><b>${Math.round(r.kmins)} min</b></div>`).join('')}
  </div>` : ''}
  <div class="card list">
    <h2>📋 Uitslagen</h2>
    ${done.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(m => `<div class="item match" data-act="openMatch" data-id="${m.id}"><div class="grow"><div class="name">${esc(matchTitle(m))}</div><div class="muted">${fmtDate(m.date)}</div></div><b>${hasScore(m) ? (m.home === false ? `${esc(m.goalsAgainst)}-${esc(m.goalsFor)}` : `${esc(m.goalsFor)}-${esc(m.goalsAgainst)}`) : '–'}</b></div>`).join('')}
  </div>`;
}

function sheet(html){
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = iconize(`<div class="box">${html}</div>`);
    document.body.appendChild(d);
    const inp = d.querySelector('input');
    const done = ok => { d.remove(); res(ok ? (inp ? inp.value : true) : (inp ? null : false)); setTimeout(() => { try { flushPending(); } catch(e){} }, 0); };
    d.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === 'ok'); else if (e.target === d) done(false); });
    inp && inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(true); });
    setTimeout(() => inp && inp.focus(), 60);
  });
}

const askNum = (msg, val) => sheet(`<p>${esc(msg)}</p><input type="number" inputmode="numeric" value="${esc(val)}" style="font-size:22px;text-align:center"><div class="grid2" style="margin-top:12px"><button class="btn" data-r="no">Annuleren</button><button class="btn pri" data-r="ok">OK</button></div>`);

/* ===================== Acties ===================== */
function toast(msg){ document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = stripEmo(msg); document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const commit = () => { save(); render(); };
const go = tab => { ui.tab = tab; ui.matchId = null; ui.sel = null; render(); window.scrollTo(0, 0); };

function newMatch(){
  const se = season();
  const m = {id:uid(), opponent:'', date:new Date().toISOString().slice(0, 10), home:true,
    present: se.players.map(p => p.id), keepers:{}, goalsFor:'', goalsAgainst:'',
    settings:{fieldPlayers:se.fieldPlayers, formation:se.formation, subMoments:se.subMoments, matchMinutes:se.matchMinutes, keeperMode:se.keeperMode, base:se.subMoments + 1},
    segments:Array.from({length: se.subMoments + 1}, () => Array(positions(se.fieldPlayers, se.formation).length).fill(null)),
    phase:'prep', cur:0, goals:{}};
  se.matches.push(m);
  ui.open = {}; ui.matchId = m.id; ui.seg = 0; ui.sel = null; commit(); window.scrollTo(0, 0);
}
async function saveDone(m){
  const tot = Object.values(m.goals || {}).reduce((a, b) => a + b, 0);
  if (m.goalsFor === '' || m.goalsFor == null){ m.goalsFor = 0; m.goalsAgainst = m.goalsAgainst || 0; }
  if (tot !== +m.goalsFor && !await ask(`Er zijn ${tot} doelpuntenmakers ingevuld bij ${m.goalsFor} doelpunt(en). Toch opslaan?`, 'Opslaan')) return;
  m.phase = 'done'; m.cutsLocked = true; ui.seg = 0; ui.sel = null; commit(); window.scrollTo(0, 0);
  toast('Wedstrijd opgeslagen als gespeeld ✅');
}
function swap(m, a, b){
  const lu = m.segments[ui.seg];
  if (a.type === 'f' && b.type === 'f') [lu[a.i], lu[b.i]] = [lu[b.i], lu[a.i]];
  else if (a.type === 'bz' || b.type === 'bz'){ const f = a.type === 'f' ? a : b; if (f.type === 'f') lu[f.i] = null; }
  else { const f = a.type === 'f' ? a : b, bn = a.type === 'b' ? a : b; lu[f.i] = bn.id; }
  m.edited = true;
}
function fitSegments(m){
  const n = m.settings.subMoments + 1, len = positions(m.settings.fieldPlayers, m.settings.formation).length;
  const segs = (m.segments || []).slice(0, n).map(lu => { lu = lu.slice(0, len); while (lu.length < len) lu.push(null); return lu; });
  while (segs.length < n) segs.push(segs.length ? segs[segs.length - 1].slice() : Array(len).fill(null));
  m.segments = segs;
}
function regenIfNeeded(m){
  if (!m || !m.segments) return;
  if (m.manual){ fitSegments(m); toast('Blokken aangepast'); }
  else { generate(m, false); toast('Opstelling bijgewerkt'); }
}
function addPlayerFromForm(){
  const se = season(), n = (niceFirst(document.getElementById('newName').value) + ' ' + niceLast(document.getElementById('newLast')?.value || '')).trim();
  if (!n){ document.getElementById('newName').focus(); return; }
  se.players.push({id:uid(), name:n, number:document.getElementById('newNum').value.trim(), pref:[]});
  commit(); toast(`${shortName(n)} toegevoegd`); document.getElementById('newName').focus();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-tab]');
  if (drag.suppress){ drag.suppress = false; if (e.target.closest('[data-drag],#livePitch,#benchZone')) return; }
  if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT')) return;
  if (el.dataset.tab){ if (el.dataset.tab === 'settings') ui.sOpen = true; go(el.dataset.tab); return; }
  const act = el.dataset.act, id = el.dataset.id, se = season(), m = match();
  const tgt = el.dataset.scope === 'match' ? m && m.settings : se;
  switch (act){
    case 'team': S.active.team = id; ui.matchId = null; ui.sel = null; ui.tab = 'matches'; commit(); window.scrollTo(0, 0); break;
    case 'goSettings': { const r = await newTeamDialog(); if (r && r.join) await pasteInvite(); else if (r) createTeam(r.name, r.club, r.season); break; }
    case 'goSettings2': e.preventDefault(); ui.sOpen = true; ui.stab = 'team'; go('settings'); break;
    case 'goPlayers': ui.sOpen = true; ui.stab = 'spelers'; go('settings'); break;
    case 'sOpen': S.active.team = id; ui.sOpen = true; ui.stab = 'team'; ui.matchId = null; commit(); window.scrollTo(0, 0); break;
    case 'sHome': ui.sOpen = true; render(); window.scrollTo(0, 0); break;
    case 'teamColor': { const tt = S.teams.find(x => x.id === id); tt.color = el.dataset.c; commit(); break; }
    case 'stab': e.preventDefault(); ui.stab = el.dataset.v; render(); break;
    case 'togglePresent': {
      const pid = el.dataset.id, from = m.phase === 'live' ? (m.cur || 0) : 0;
      if (m.phase === 'prep' && season().players.some(p => p.id === pid)){ m.att = m.att || {}; m.att[pid] = isIn(m, pid) ? 'nee' : 'ja'; if (m.poll && cloud.api && myUid()) cloud.api.pollAnswer(m.poll.id, pid, m.att[pid]).catch(() => {}); }
      if (isIn(m, pid)){
        const played = from > 0 && m.segments.slice(0, from).some(lu => lu.includes(pid));
        if (played){ m.out = m.out || {}; m.out[pid] = from; }
        else m.present = m.present.filter(x => x !== pid);
        m.segments.forEach((lu, s) => { if (s >= from) lu.forEach((x, i) => { if (x === pid) lu[i] = null; }); });
        if (m.phase === 'live'){ fillHoles(m, from); toast(`${pname(pid)} is eruit – plek opgevuld`); }
      } else {
        if (m.out && m.out[pid] != null) delete m.out[pid];
        if (!m.present.includes(pid)) m.present.push(pid);
        if (m.phase === 'live') toast(`${pname(pid)} staat bij de reserves`);
      }
      commit(); break;
    }
    case 'phase': {
      const v = el.dataset.v;
      if (v === 'done'){ await saveDone(m); break; }
      if (v !== 'prep') m.cutsLocked = true;
      if (v === 'live'){ m.cur = m.cur || 0; ui.seg = m.cur; if (m.phase === 'prep') toast('Wedstrijd gestart – succes! ⚽'); }
      if (v === 'post' && (m.goalsFor === '' || m.goalsFor == null)){ m.goalsFor = 0; m.goalsAgainst = 0; }
      m.phase = v; ui.sel = null; commit(); window.scrollTo(0, 0); break;
    }
    case 'nextSeg': {
      const n = m.segments.length;
      if ((m.cur || 0) >= n - 1) break;
      m.cur = (m.cur || 0) + 1; ui.seg = m.cur; ui.sel = null;
      if (isEmptySeg(m.segments[m.cur])) m.segments[m.cur] = m.segments[m.cur - 1].slice();
      commit(); toast(`Wissel doorgevoerd – blok ${m.cur + 1} loopt`); window.scrollTo(0, 0); break;
    }
    case 'score': { const k = el.dataset.k; m[k] = Math.max(0, (+m[k] || 0) + (+el.dataset.d)); commit(); break; }
    case 'goal': {
      m.goals = m.goals || {}; const gid = el.dataset.id;
      m.goals[gid] = Math.max(0, (m.goals[gid] || 0) + (+el.dataset.d));
      const tot = Object.values(m.goals).reduce((a, b) => a + b, 0);
      if (tot > (+m.goalsFor || 0)) m.goalsFor = tot;
      commit(); break;
    }
    case 'saveDone': await saveDone(m); break;
    case 'addGuest': {
      const n = document.getElementById('guestName').value.trim();
      if (!n){ document.getElementById('guestName').focus(); return; }
      const g = {id:uid(), name:n, number:'', pref:[], guest:true};
      m.guests = m.guests || []; m.guests.push(g); m.present.push(g.id);
      commit(); toast(`${n} doet mee als invaller`); break;
    }
    case 'delGuest': {
      m.guests = (m.guests || []).filter(g => g.id !== id); m.present = m.present.filter(x => x !== id);
      m.segments = m.segments.map(lu => lu.map(x => x === id ? null : x)); if (m.phase === 'live') fillHoles(m, m.cur || 0);
      commit(); break;
    }
    case 'newMatch': newMatch(); break;
    case 'openMatch': ui.open = {}; ui.tab = 'matches'; ui.matchId = id; ui.seg = 0; ui.sel = null; render(); window.scrollTo(0, 0); break;
    case 'back': ui.matchId = null; ui.sel = null; render(); break;
    case 'step': {
      const k = el.dataset.k, [mn, mx, stp] = LIMITS[k];
      tgt[k] = Math.max(mn, Math.min(mx, tgt[k] + (+el.dataset.d) * stp));
      if (k === 'fieldPlayers') tgt.formation = FORMATIONS[tgt[k]][0].n;
      if (k !== 'fieldPlayers') delete tgt.cuts;
      if (el.dataset.scope === 'match'){ if (k === 'fieldPlayers') delete m.posOverride; regenIfNeeded(m); }
      commit(); break;
    }
    case 'kmode':
      tgt.keeperMode = el.dataset.v;
      if (el.dataset.scope === 'match'){ m.keepers = {}; regenIfNeeded(m); }
      commit(); break;
    case 'home': m.home = el.dataset.v === '1'; commit(); pollSync(); break;
    case 'arriveReset': e.preventDefault(); delete m.arriveTime; commit(); pollSync(); break;
    case 'startPoll': await startPoll(m); break;
    case 'coachAtt': await coachAnswer(m, id); break;
    case 'gen': case 'mix':
      if (m.segments && m.edited && !await ask('Je handmatige wissels worden overschreven. Doorgaan?')) return;
      m.manual = false; generate(m, act === 'mix'); ui.seg = 0; ui.sel = null; ui.open.setup = false; commit();
      if (act === 'mix') toast('Nieuwe verdeling gemaakt');
      break;
    case 'seg': {
      ui.seg = +el.dataset.i; ui.sel = null;
      if (ui.seg > 0 && isEmptySeg(m.segments[ui.seg]) && !isEmptySeg(m.segments[ui.seg - 1])){ m.segments[ui.seg] = m.segments[ui.seg - 1].slice(); save(); toast('Vorig blok overgenomen – pas de wissels aan'); }
      render(); break;
    }
    case 'manual': {
      if (m.segments && !await ask('Je huidige opstelling wordt leeggemaakt. Zelf opnieuw beginnen?')) return;
      const len = positions(m.settings.fieldPlayers, m.settings.formation).length;
      m.segments = Array.from({length: m.settings.subMoments + 1}, () => Array(len).fill(null));
      m.manual = true; m.edited = true; ui.seg = 0; ui.sel = null; ui.open.setup = false; commit();
      toast('Sleep spelers van de bank naar het veld'); break;
    }
    case 'copyPrev': m.segments[ui.seg] = m.segments[ui.seg - 1].slice(); m.edited = true; commit(); toast('Vorig blok overgenomen'); break;
    case 'clearSeg': m.segments[ui.seg] = m.segments[ui.seg].map(() => null); m.edited = true; commit(); break;
    case 'regenRest': generate(m, false, ui.seg + 1); m.edited = true; commit(); toast('De rest van de wedstrijd is opnieuw eerlijk verdeeld'); break;
    case 'resetPos': delete m.posOverride; commit(); break;
    case 'addSub': {
      const times = segTimes(m.settings), b = m.phase === 'live' ? (m.cur || 0) : ui.seg;
      let def = Math.round((times[b][0] + times[b][1]) / 2);
      if (times.some(t => t[0] === def)) def = times[b][0] + 1;
      const r = await subDialog(m, def);
      if (!r) return;
      addSubMoment(m, r.min, r.s, r.pairs);
      commit(); window.scrollTo(0, 0);
      toast(r.pairs.length ? `Wissel op ${r.min}' toegevoegd` : `Wisselmoment op ${r.min}' toegevoegd – zet de wissel op het veld`); break;
    }
    case 'delSub': {
      const t = segTimes(m.settings)[ui.seg];
      const happened = m.phase === 'live' && ui.seg <= (m.cur || 0);
      if (!await ask(`Wisselmoment op ${t[0]}' (${blockLabel(m, ui.seg)}) weghalen?${happened ? ' Deze wissel is al gebeurd: de spelers van het blok ervoor tellen dan door tot ' + t[1] + "'." : ' De opstelling van het blok ervoor loopt dan door.'}`, 'Weghalen')) return;
      removeSubMoment(m, ui.seg); commit(); toast('Wisselmoment weggehaald'); break;
    }
    case 'resetSubs': {
      if (!await ask('Terug naar de standaard wisselmomenten uit Instellingen?', 'Ja')) return;
      m.cutsLocked = false; delete m.settings.cuts; m.settings.subMoments = -1; ui.seg = 0; commit(); break;
    }
    case 'splitSeg': {
      const t = segTimes(m.settings)[ui.seg];
      if (t[1] - t[0] < 2){ await tell('Dit blok is te kort om te splitsen.'); return; }
      const sug = Math.round((t[0] + t[1]) / 2);
      const v = await askNum(`Op welke minuut wil je een extra wissel? (tussen ${t[0] + 1} en ${t[1] - 1})`, sug);
      if (v === null) return;
      const min = parseInt(v);
      if (!(min > t[0] && min < t[1])){ await tell(`Kies een minuut tussen ${t[0] + 1} en ${t[1] - 1}.`); return; }
      const all = segTimes(m.settings);
      m.settings.cuts = [...all.slice(1).map(x => x[0]), min].sort((a, b) => a - b);
      m.settings.subMoments++;
      m.segments.splice(ui.seg + 1, 0, m.segments[ui.seg].slice());
      if (m.settings.keeperMode === 'blok'){ const k = {}; Object.entries(m.keepers).forEach(([i, v]) => { i = +i; k[i > ui.seg ? i + 1 : i] = v; }); m.keepers = k; }
      ui.seg++; m.edited = true; commit(); toast(`Extra wissel op ${min}' – zet de wissel nu op het veld`); break;
    }
    case 'tapField': case 'tapBench': {
      const t = act === 'tapField' ? {type:'f', i:+el.dataset.i} : {type:'b', id};
      if (!ui.sel){ ui.sel = t; render(); break; }
      const same = ui.sel.type === t.type && (t.type === 'f' ? ui.sel.i === t.i : ui.sel.id === t.id);
      if (same || (ui.sel.type === 'b' && t.type === 'b')){ ui.sel = same ? null : t; render(); break; }
      swap(m, ui.sel, t); ui.sel = null; commit(); break;
    }
    case 'delMatch': if (await ask('Deze wedstrijd verwijderen?')){ se.matches = se.matches.filter(x => x.id !== m.id); ui.matchId = null; commit(); } break;
    case 'share': shareMatch(m); break;
    case 'print': buildPrint(m); setTimeout(() => window.print(), 50); break;

    case 'addPlayer': addPlayerFromForm(); break;
    case 'bulk': {
      const names = document.getElementById('bulk').value.split(/\n|,/).map(s => s.trim()).filter(Boolean);
      names.forEach(n => se.players.push({id:uid(), name:n, number:'', pref:[]}));
      commit(); toast(`${names.length} spelers toegevoegd`); break;
    }
    case 'copyPlayers': {
      const from = S.teams.flatMap(t => t.seasons).find(s => s.id === document.getElementById('copyFrom').value);
      if (!from) return;
      const have = new Set(se.players.map(p => p.name.toLowerCase()));
      let c = 0;
      from.players.forEach(p => { if (!have.has(p.name.toLowerCase())){ se.players.push({...p, id:uid(), pref:[...(p.pref || [])]}); c++; } });
      commit(); toast(`${c} spelers overgenomen`); break;
    }
    case 'pref': {
      const p = player(id), l = el.dataset.l; p.pref = p.pref || [];
      p.pref = p.pref.includes(l) ? p.pref.filter(x => x !== l) : [...p.pref, l];
      commit(); break;
    }
    case 'delPlayer': {
      const p = player(id);
      if (!await ask(`${p.name} verwijderen?`)) return;
      se.players = se.players.filter(x => x.id !== id);

function onColor(hex){

}

/* ===================== KNVB-standaard per leeftijd ===================== */
// Bron: KNVB-richtlijnen speelvormen en speeltijden (O7 t/m O19, senioren)
const KNVB = [
  {max:7,  fp:4,  min:40, t:'4 tegen 4 · 8×5 min'},
  {max:9,  fp:6,  min:40, t:'6 tegen 6 · 2×20 min'},
  {max:10, fp:6,  min:50, t:'6 tegen 6 · 2×25 min'},
  {max:12, fp:8,  min:60, t:'8 tegen 8 · 2×30 min'},
  {max:13, fp:11, min:60, t:'11 tegen 11 · 2×30 min'},
  {max:15, fp:11, min:70, t:'11 tegen 11 · 2×35 min'},
  {max:17, fp:11, min:80, t:'11 tegen 11 · 2×40 min'},
  {max:99, fp:11, min:90, t:'11 tegen 11 · 2×45 min'}
];
function knvbFor(name){
  const r = String(name || '').match(/(?:^|[^a-z])(?:j|m|v)?o\s*-?\s*(\d{1,2})(?!\d)/i);
  const age = r ? +r[1] : null;
  const row = KNVB.find(k => (age || 99) <= k.max);
  return {...row, age, label: age ? `O${age}` : 'senioren'};
}
function applyKnvb(se, name){
  const k = knvbFor(name);
  const fpChanged = se.fieldPlayers !== k.fp;
  se.fieldPlayers = k.fp; se.matchMinutes = k.min;
  if (fpChanged || !FORMATIONS[k.fp].some(f => f.n === se.formation)) se.formation = FORMATIONS[k.fp][0].n;
  if (fpChanged) se.subMoments = k.fp >= 11 ? 1 : 3;
  return k;
}
const knvbMatches = (se, name) => { const k = knvbFor(name); return se.fieldPlayers === k.fp && se.matchMinutes === k.min; };

/* ===================== Voorkeursposities ===================== */
const POS_NAMES = {K:'Keeper', LB:'Linksback', LV:'Linksachter', LCV:'Linker centrale verdediger', CV:'Centrale verdediger', RCV:'Rechter centrale verdediger', RV:'Rechtsachter', RB:'Rechtsback', LVM:'Linker verdedigende middenvelder', VM:'Verdedigende middenvelder', RVM:'Rechter verdedigende middenvelder', LM:'Linkermiddenveld', LCM:'Linker centrale middenvelder', CM:'Centraal middenveld', RCM:'Rechter centrale middenvelder', AM:'Aanvallende middenvelder', RM:'Rechtermiddenveld', LA:'Linksbuiten', LS:'Linkerspits', SP:'Spits', RS:'Rechterspits', RA:'Rechtsbuiten'};
const POS_ORDER = ['K','LB','LV','LCV','CV','RCV','RV','RB','LVM','VM','RVM','LM','LCM','CM','RCM','RM','AM','LA','LS','SP','RS','RA'];
const lineOf = c => c === 'K' ? 'K' : /^(L?R?CV|LV|RV|LB|RB)$/.test(c) ? 'V' : /^(LM|RM|AM|[LR]?CM|[LR]?VM)$/.test(c) ? 'M' : 'A';
const baseOf = c => /^[LR](CV|CM|VM)$/.test(c) ? c.slice(1) : c;
const sideOf = c => c === 'K' ? 'K' : c[0] === 'L' ? 'L' : c[0] === 'R' ? 'R' : 'C';
// groepen: hele linie of een kant van het veld
const POS_GROUPS = [{v:'g:V', n:'Achter', s:'Achter (verdediging)'}, {v:'g:M', n:'Midden', s:'Middenveld'}, {v:'g:A', n:'Voor', s:'Voor (aanval)'}, {v:'g:L', n:'Links', s:'Linkerflank'}, {v:'g:C', n:'As', s:'As (centraal)'}, {v:'g:R', n:'Rechts', s:'Rechterflank'}];
const prefName = c => { const g = POS_GROUPS.find(x => x.v === c); return g ? g.n : c; };
function prefQuality(c, P){
  if (!c) return 0;
  if (c.startsWith('g:')){
    const g = c.slice(2); if (P.line === 'K') return 0;
    return 'VMA'.includes(g) ? (P.line === g ? .8 : 0) : (sideOf(P.code) === g ? .8 : 0);
  }
  if (c === P.code) return 1;
  if (baseOf(c) === baseOf(P.code)) return .9;
  if (lineOf(c) === P.line) return .2;
  return 0;
}
const usePos = () => !!season().usePositions;
const posCodes = st => POS_ORDER.filter(c => positions(st.fieldPlayers, st.formation).some(p => p.code === c));
const prefsOf = p => ((p && p.pos) || []).filter(Boolean);
function prefScore(p, P){
  const prefs = (p && p.pos) || [];
  let sc = 0;
  prefs.forEach((c, k) => { if (c) sc = Math.max(sc, [30, 20, 10][k] * prefQuality(c, P)); });
  if (P.line === 'K' && prefs.some(Boolean) && !prefs.includes('K')) sc -= 50;
  if (P.line !== 'K' && prefs[0] === 'K' && prefs.filter(Boolean).length === 1) sc -= 5;
  return sc;
}
const canKeep = id => prefsOf(player(id)).includes('K');
const prefTag = p => usePos() && prefsOf(p).length ? `<small class="pp">${prefsOf(p).map(c => c === 'K' ? '🧤' : prefName(c)).join(' · ')}</small>` : '';

/* ===================== Wisselmomenten per wedstrijd ===================== */
function periodName(k, base){ if (base === 2) return `${k + 1}e helft`; if (base === 4) return `${k + 1}e kwart`; return k === 0 ? 'Start' : `${k}e wissel`; }
function blockLabel(m, s){
  const st = m.settings, times = segTimes(st), base = st.base || times.length;
  if (base !== 2 && base !== 4) return s === 0 ? 'Start' : `${s}e wissel`;
  const plen = st.matchMinutes / base, start = times[s][0];
  const k = Math.min(base - 1, Math.floor((start + 0.001) / plen));
  return start === Math.round(k * plen) ? periodName(k, base) : `${periodName(k, base)} · wissel ${start}'`;
}
function blocksText(n){ return n === 2 ? '2 helften' : n === 4 ? '4 kwarten' : `${n} blokken`; }
function addSubMoment(m, min, s, pairs){
  const times = segTimes(m.settings);
  if (!m.settings.base) m.settings.base = m.cutsLocked ? null : times.length;
  m.settings.cuts = [...times.slice(1).map(t => t[0]), min].sort((a, b) => a - b);
  m.settings.subMoments++;
  const lu = m.segments[s].slice();
  pairs.forEach(p => {
    if (p.out){ const i = lu.indexOf(p.out); if (i >= 0) lu[i] = p.in || null; }
    else if (p.in){ const i = lu.indexOf(null); if (i >= 0) lu[i] = p.in; }
  });
  m.segments.splice(s + 1, 0, lu);
  if (m.out) Object.keys(m.out).forEach(id => { if (m.out[id] > s) m.out[id]++; });
  if (m.phase === 'live' && (m.cur || 0) >= s) m.cur = (m.cur || 0) + 1;
  m.cutsLocked = true; m.edited = true; ui.seg = s + 1; ui.sel = null;
}
function removeSubMoment(m, s){
  const times = segTimes(m.settings);
  if (!m.settings.base) m.settings.base = m.cutsLocked ? null : times.length;
  m.settings.cuts = times.slice(1).map(t => t[0]).filter(c => c !== times[s][0]);
  m.settings.subMoments--;
  m.segments.splice(s, 1);
  if (m.out) Object.keys(m.out).forEach(id => { if (m.out[id] > s) m.out[id]--; });
  if (m.phase === 'live' && (m.cur || 0) >= s) m.cur = Math.max(0, (m.cur || 0) - 1);
  m.cutsLocked = true; m.edited = true; ui.seg = Math.max(0, s - 1); ui.sel = null;
}
// Dialoog: minuut + wie eruit / wie erin (alleen logische keuzes)
function subDialog(m, defMin){
  return new Promise(res => {
    const times = segTimes(m.settings);
    const blockOf = min => times.findIndex(t => min > t[0] && min < t[1]);
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = iconize(`<div class="box"><p>🔁 Wisselmoment toevoegen</p>
      <label class="f">Op welke minuut?<input type="number" inputmode="numeric" id="sdMin" value="${defMin}" style="font-size:22px;text-align:center"></label>
      <div class="muted" id="sdInfo" style="margin-bottom:8px"></div>
      <div id="sdRows"></div>

      <div class="grid2" style="margin-top:14px"><button class="btn" data-r="no">Annuleren</button><button class="btn pri" data-r="ok">Toevoegen</button></div></div>`);
    document.body.appendChild(d);
    let pairs = [{out:'', in:''}], lastS = blockOf(defMin);
    const minVal = () => parseInt(d.querySelector('#sdMin').value);
    const draw = () => {
      const s = blockOf(minVal()), info = d.querySelector('#sdInfo'), rows = d.querySelector('#sdRows');
      d.querySelector('#sdAdd').style.display = s < 0 ? 'none' : '';
      if (s < 0){ info.innerHTML = `<span style="color:var(--acc)">Kies een minuut tussen 1 en ${m.settings.matchMinutes - 1} waarop nog geen wisselmoment is.</span>`; rows.innerHTML = ''; return; }
      info.textContent = `Valt in ${blockLabel(m, s)} (${times[s][0]}'–${times[s][1]}'). Kies wie eruit gaat en wie erin komt.`;
      const field = m.segments[s].filter(Boolean), bench = benchIds(m, s);
      rows.innerHTML = iconize(pairs.map((p, i) => {
        const outs = field.filter(id => id === p.out || !pairs.some(q => q.out === id));
        const ins = bench.filter(id => id === p.in || !pairs.some(q => q.in === id));
        return `<div class="subrow">
          <select data-i="${i}" data-k="out"><option value="">⬇️ Eruit…</option>${outs.map(id => `<option value="${id}" ${id === p.out ? 'selected' : ''}>${esc(pname(id))}</option>`).join('')}</select>
          <b>⇄</b>
          <select data-i="${i}" data-k="in"><option value="">⬆️ Erin…</option>${ins.map(id => `<option value="${id}" ${id === p.in ? 'selected' : ''}>${esc(pname(id))}</option>`).join('')}</select>
        </div>`;
      }).join('') + (bench.length ? '' : '<div class="muted">Er zitten geen reserves op de bank.</div>'));
    };
    d.querySelector('#sdMin').addEventListener('input', () => { const s = blockOf(minVal()); if (s !== lastS){ pairs = [{out:'', in:''}]; lastS = s; } draw(); });
    d.addEventListener('change', e => { e.stopPropagation(); const sel = e.target.closest('select[data-i]'); if (!sel) return; pairs[+sel.dataset.i][sel.dataset.k] = sel.value; draw(); });
    d.addEventListener('click', e => {
      e.stopPropagation();
      if (e.target.id === 'sdAdd'){ pairs.push({out:'', in:''}); draw(); return; }
      const b = e.target.closest('[data-r]');
      if (b && b.dataset.r === 'ok'){ const min = minVal(), s = blockOf(min); if (s < 0) return; d.remove(); res({min, s, pairs: pairs.filter(p => p.out || p.in)}); }
      else if (b || e.target === d){ d.remove(); res(null); }

const randId = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(x => 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]).join(''); };
const surveyUrl = sid => location.origin + location.pathname + '?vraag=' + sid;
async function startSurvey(se, t){
  const api = await firebaseApi();

  if (!await needLogin('Log in om een link voor de spelers te maken.')) return;
  if (!await ask(`${se.survey && se.survey.key ? 'Een nieuwe ronde starten? De oude link stopt dan. ' : ''}Een link maken waarmee de spelers van ${teamLabel(t)} zelf hun naam en favoriete posities kiezen? De huidige voorkeursposities van alle spelers worden leeggemaakt.`, 'Link maken')) return;
  const sid = randId(24);
  const codes = posCodes(se);
  let pk, key;
  try {
    const kp = await crypto.subtle.generateKey({name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1, 0, 1]), hash:'SHA-256'}, true, ['encrypt', 'decrypt']);
    pk = await crypto.subtle.exportKey('jwk', kp.publicKey); key = await crypto.subtle.exportKey('jwk', kp.privateKey);
  } catch(e){ await tell('Deze browser kan geen beveiligde link maken.'); return; }
  try {
    await api.createSurvey(sid, {v:2, team: teamLabel(t), club: t.club || '', codes, pk: JSON.stringify({kty: pk.kty, n: pk.n, e: pk.e}), created: Date.now()});
  } catch(e){ console.error(e); await tell('Het maken van de link lukt niet. Staan de nieuwe Firestore-regels erin? (zie FIREBASE.md) Melding: ' + (e.message || e)); return; }
  se.players.forEach(p => p.pos = ['', '', '']);
  se.usePositions = true;

}

async function fetchSurvey(se, quiet){
  if (!se.survey || !se.survey.key || !myUid()) return;
  const api = await firebaseApi(); if (!api || !api.listResponses) return;
  ui.surveyBusy = true;
  try {
    const sid = se.survey.sid;
    const rs = (await api.listResponses(sid)).sort((a, b) => (a.at || 0) - (b.at || 0));
    se = S.teams.flatMap(x => x.seasons).find(x => x.survey && x.survey.sid === sid); if (!se) throw new Error('enquête niet meer gevonden');
    let added = 0, updated = 0;
    const priv = await crypto.subtle.importKey('jwk', se.survey.key, {name:'RSA-OAEP', hash:'SHA-256'}, false, ['decrypt']);
    for (const r of rs){
      if (se.survey.seen.includes(r.id) || typeof r.c !== 'string') continue;
      let d;
      try { d = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'RSA-OAEP'}, priv, Uint8Array.from(atob(r.c), ch => ch.charCodeAt(0))))); }
      catch(e){ se.survey.seen.push(r.id); continue; }
      se.survey.seen.push(r.id);
      const first = niceFirst(String(d.f || '').slice(0, 30)), last = niceLast(String(d.l || '').slice(0, 40));
      if (!first) continue;
      const full = `${first} ${last}`.trim();
      let p = se.players.find(x => normName(x.name) === normName(full));
      if (!p){ const solo = se.players.filter(x => normName(x.name) === normName(first)); if (solo.length === 1) p = solo[0]; }
      if (!p){ p = {id: uid(), name: full, number: '', pref: []}; se.players.push(p); added++; }
      else p.name = full;
      p.pos = (Array.isArray(d.p) ? d.p : []).slice(0, 3).map(c => String(c || '').slice(0, 6)); while (p.pos.length < 3) p.pos.push('');
      se.survey.answered[p.id] = r.at || Date.now(); updated++;
    }
    ui.surveyFetched = Date.now();
    if (updated){ save(); toast(`${updated} antwoord${updated === 1 ? '' : 'en'} verwerkt${added ? ` · ${added} nieuwe speler${added === 1 ? '' : 's'}` : ''}`); }
    else if (!quiet) toast('Nog geen nieuwe antwoorden');
  } catch(e){ console.error(e); if (!quiet) tell('Antwoorden ophalen lukt niet. Melding: ' + (e.message || e)); }
  ui.surveyBusy = false; render();
}

    const mid = m.id;
    polls[m.poll.id] = {unsub: cloud.api.pollListen(m.poll.id, d => {
      if (!d) return;

      if (JSON.stringify(d.answers || {}) === JSON.stringify(mm.att || {})) return;

      const a = document.activeElement;
      if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && !document.querySelector('.modal')) render();
    }, e => console.error(e))};
  })));
  Object.keys(polls).forEach(pid => { if (!want.has(pid)){ polls[pid].unsub && polls[pid].unsub(); delete polls[pid]; } });

/* ===================== Online samenwerken (Firebase, met inloggen) ===================== */
const DATA_VERSION = 7;               // ophogen als de opbouw van de gegevens verandert
const FIREBASE_SDK = '10.12.2';
const CLOUD_KEY = 'opstellingmaker.cloud';
const DEVICE = (() => { let d = localStorage.getItem('opstellingmaker.device'); if (!d){ d = uid() + uid(); try { localStorage.setItem('opstellingmaker.device', d); } catch(e){} } return d; })();
// Koppelingen per team op dit apparaat: {lokaalTeamId: {id: onlineTeamId, v: 7}}  (oud: {code, id: 64 tekens})
const CLOUD_MAP_KEY = 'opstellingmaker.cloud.teams';
const ME_KEY = 'opstellingmaker.me';
const cloud = {creating:new Set(), api:null, status:'off', outdated:false, pending:null, links:{}, user:null, authKnown:false, syncing:false, authUnsub:null};
const cloudMap = () => { try { return JSON.parse(localStorage.getItem(CLOUD_MAP_KEY)) || {}; } catch(e){ return {}; } };
const setCloudMap = m => { try { localStorage.setItem(CLOUD_MAP_KEY, JSON.stringify(m)); } catch(e){} };
const cloudCfg = (tid = S.active.team) => cloudMap()[tid] || null;
const isLegacy = c => !!c && c.v !== 7;
const cloudAvailable = () => !!(window.__cloudApi || window.FIREBASE_CONFIG);
const myUid = () => cloud.user && cloud.user.uid;
const myName = () => (cloud.user && cloud.user.displayName) || localStorage.getItem(ME_KEY) || '';
const hasContent = t => t.seasons.some(se => se.players.length || se.matches.length);
async function sha(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

let fbApiPromise = null;
function firebaseApi(){
  if (window.__cloudApi) return Promise.resolve(window.__cloudApi);
  if (!window.FIREBASE_CONFIG) return Promise.resolve(null);
  if (fbApiPromise) return fbApiPromise;
  fbApiPromise = (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/`;
    const [{initializeApp}, fs, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
    const app = initializeApp(window.FIREBASE_CONFIG);
    const db = fs.getFirestore(app), auth = au.getAuth(app);
    auth.languageCode = 'nl';
    const d = (...p) => fs.doc(db, ...p);
    const data = s => s.exists() ? s.data() : null;
    return {
      // inloggen
      onAuth: cb => au.onAuthStateChanged(auth, u => cb(u ? {uid: u.uid, email: u.email, displayName: u.displayName} : null)),
      signInGoogle: async () => { const r = await au.signInWithPopup(auth, new au.GoogleAuthProvider()); return r.user; },
      signInEmail: (e, p) => au.signInWithEmailAndPassword(auth, e, p),
      signUpEmail: async (e, p, name) => { const r = await au.createUserWithEmailAndPassword(auth, e, p); if (name) await au.updateProfile(r.user, {displayName: name}); return r.user; },
      setName: async name => { if (auth.currentUser) await au.updateProfile(auth.currentUser, {displayName: name}); },
      resetPassword: e => au.sendPasswordResetEmail(auth, e),
      signOut: () => au.signOut(auth),
      // oude opslag (alleen om over te zetten)
      get: async id => data(await fs.getDoc(d('clubs', id))),
      set: (id, v) => fs.setDoc(d('clubs', id), v),
      // teams
      teamGet: async id => data(await fs.getDoc(d('teams', id))),
      teamCreate: (id, v) => fs.setDoc(d('teams', id), v),
      teamPush: (id, v) => fs.setDoc(d('teams', id), v, {merge: true}),
      teamListen: (id, cb, err) => fs.onSnapshot(d('teams', id), s => cb(data(s)), err),
      teamJoin: (id, uid, via) => fs.updateDoc(d('teams', id), {['members.' + uid]: 'trainer', via, updated: Date.now()}),
      teamRemoveMember: (id, uid) => fs.updateDoc(d('teams', id), {['members.' + uid]: fs.deleteField(), updated: Date.now()}),
      // uitnodigingen
      inviteCreate: (id, v) => fs.setDoc(d('invites', id), v),
      inviteGet: async id => data(await fs.getDoc(d('invites', id))),
      inviteClaim: (id, uid, name) => fs.updateDoc(d('invites', id), {usedBy: uid, usedName: name || '', usedAt: Date.now()}),
      inviteDelete: id => fs.deleteDoc(d('invites', id)),
      // eigen lijst met teams (voor een nieuwe telefoon)
      userGet: async uid => data(await fs.getDoc(d('users', uid))),
      userSet: (uid, v) => fs.setDoc(d('users', uid), v, {merge: true}),
      userRemoveTeam: (uid, rid) => fs.updateDoc(d('users', uid), {['teams.' + rid]: fs.deleteField()}),
      // wie zijn erbij
      pollCreate: (id, v) => fs.setDoc(d('polls', id), v),
      pollUpdate: (id, v) => fs.setDoc(d('polls', id), v, {merge: true}),
      pollAnswer: (id, pid, v) => fs.updateDoc(d('polls', id), {['answers.' + pid]: v, updated: Date.now()}),
      pollListen: (id, cb, err) => fs.onSnapshot(d('polls', id), s => cb(data(s)), err),
      // vraag het de spelers
      getSurvey: async sid => data(await fs.getDoc(d('surveys', sid))),
      createSurvey: (sid, v) => fs.setDoc(d('surveys', sid), v),
      addResponse: (sid, v) => fs.addDoc(fs.collection(db, 'surveys', sid, 'responses'), v),
      listResponses: async sid => (await fs.getDocs(fs.collection(db, 'surveys', sid, 'responses'))).docs.map(x => ({id: x.id, ...x.data()}))
    };
  })();
  fbApiPromise.catch(() => fbApiPromise = null);
  return fbApiPromise;
}

function linkStatus(tid, st){ const L = cloud.links[tid]; if (L) L.status = st; if (tid === S.active.team) setCloudStatus(); }
function setCloudStatus(st){
  if (st === undefined){ const L = cloud.links[S.active.team], c = cloudCfg(); st = cloud.outdated ? 'old' : L ? L.status : (c && !cloud.user && cloud.authKnown) ? 'login' : 'off'; }
  cloud.status = st;
  const el = document.getElementById('cloudDot');
  if (el){ el.innerHTML = iconize({ok:'☁️ ✓', busy:'☁️ …', err:'☁️ ⚠️', old:'⬆️ ververs', login:'🔒 inloggen', off:''}[st] || ''); el.className = 'cloud ' + st; }
}
function teamFromRemote(r, local){
  let d; try { d = JSON.parse(r.data); } catch(e){ return null; }
  if (r.kind === 'team' || r.members) return d && d.seasons ? d : null;
  if (d && Array.isArray(d.teams)){
    if (!local) return d.teams.length === 1 ? d.teams[0] : null;
    return d.teams.find(x => x.id === local.id) || d.teams.find(x => teamLabel(x) === teamLabel(local)) || d.teams.find(x => x.name === local.name) || null;
  }
  return null;
}
async function migrateOldCloud(){
  const old = localStorage.getItem(CLOUD_KEY); if (!old) return;
  let c; try { c = JSON.parse(old); } catch(e){ c = null; }
  localStorage.removeItem(CLOUD_KEY);
  if (!c || !c.id) return;
  const map = cloudMap(); if (Object.values(map).some(x => x.id === c.id)) return;
  let tid = S.teams.length === 1 ? S.teams[0].id : null;
  if (!tid) tid = await chooseDialog(`Samenwerken werkt nu per team. Bij welk team hoort je teamcode "${c.code}"?`, sortedTeams().map(t => ({v: t.id, n: teamLabel(t)}))) || S.active.team;
  map[tid] = {code: c.code, id: c.id}; setCloudMap(map);
}
function chooseDialog(text, opts){
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'modal';
    d.innerHTML = iconize(`<div class="box"><p>☁️ ${esc(text)}</p><div style="display:grid;gap:8px">${opts.map(o => `<button class="btn pri" data-r="${esc(o.v)}">${esc(o.n)}</button>`).join('')}</div></div>`);
    document.body.appendChild(d);
    d.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-r]'); if (b){ d.remove(); res(b.dataset.r); } });
  });
}

// ---------- opstarten en inloggen ----------
async function cloudStart(){
  if (!cloudAvailable()){ setCloudStatus('off'); return; }
  await migrateOldCloud();
  try { cloud.api = await firebaseApi(); } catch(e){ console.error(e); setCloudStatus('err'); return; }
  if (!cloud.api){ setCloudStatus('off'); return; }
  if (cloud.authUnsub) return;
  await new Promise(res => {
    let first = true;
    cloud.authUnsub = cloud.api.onAuth(async u => {
      const was = myUid();
      cloud.user = u; cloud.authKnown = true;
      if (u && u.displayName) try { localStorage.setItem(ME_KEY, u.displayName); } catch(e){}
      if (u && u.uid !== was) await syncAccount();
      if (!u) stopAll();
      render();
      if (first){ first = false; res(); }
    });
  });
}
function stopAll(){ Object.keys(cloud.links).forEach(unlinkLive); setCloudStatus(); }
function unlinkLive(tid){ const L = cloud.links[tid]; if (!L) return; if (L.unsub) L.unsub(); clearTimeout(L.timer); delete cloud.links[tid]; }
function listenTeam(tid){
  const c = cloudCfg(tid); if (!c || isLegacy(c) || cloud.links[tid] || !myUid()) return;
  const L = cloud.links[tid] = {id: c.id, status:'busy', timer:null, lastRemote:0, last:null, members:{}, unsub:null};
  linkStatus(tid, 'busy');
  L.unsub = cloud.api.teamListen(c.id, r => applyRemote(tid, r), e => {
    console.error(e);
    if (e && /permission/i.test(e.code || e.message || '')) lostAccess(tid);
    else linkStatus(tid, 'err');
  });
}
async function lostAccess(tid){
  const t = S.teams.find(x => x.id === tid), c = cloudCfg(tid);
  unlinkLive(tid);
  const map = cloudMap(); delete map[tid]; setCloudMap(map);
  if (c && myUid()) cloud.api.userRemoveTeam(myUid(), c.id).catch(() => {});
  setCloudStatus(); render();
  if (t) await tell(`${teamLabel(t)} wordt niet meer met je gedeeld. Het team blijft op dit apparaat staan, maar wijzigingen van de andere trainers komen niet meer binnen.`);
}

// Na inloggen: oude koppelingen overzetten, teams online bewaren, teams van je account ophalen
async function syncAccount(){
  if (cloud.syncing) return; cloud.syncing = true;
  try {
    const uid = myUid(), api = cloud.api;
    const udoc = await api.userGet(uid).catch(() => null) || {};
    if (!myName()){
      const n = udoc.name || await askName();
      if (n){ try { localStorage.setItem(ME_KEY, n); } catch(e){} api.setName(n).catch(() => {}); cloud.user.displayName = n; }
    }
    const map = cloudMap();
    Object.keys(map).forEach(tid => { if (!S.teams.some(t => t.id === tid)) delete map[tid]; });
    setCloudMap(map);
    // 1. oude koppelingen (teamcode / eerste link-versie) overzetten
    for (const tid of Object.keys(map)) if (isLegacy(map[tid])) await migrateLegacy(tid, map[tid]).catch(e => { console.error(e); toast('Overzetten van ' + teamLabel(S.teams.find(t => t.id === tid)) + ' lukt nog niet'); });
    // 2. teams van je account die nog niet op dit apparaat staan
    const linked = new Set(Object.values(cloudMap()).map(c => c.id));
    for (const rid of Object.keys(udoc.teams || {})){
      if (linked.has(rid)) continue;
      const r = await api.teamGet(rid).catch(() => null);
      if (!r){ api.userRemoveTeam(uid, rid).catch(() => {}); continue; }
      const td = teamFromRemote(r, null); if (!td) continue;
      placeTeam(td, rid);
    }
    // 3. eigen teams met spelers of wedstrijden online bewaren
    for (const t of S.teams.slice()) if (!cloudCfg(t.id) && hasContent(t)) await createRemoteTeam(t).catch(e => console.error(e));
    await saveUserTeams();
    save();
    Object.keys(cloudMap()).forEach(listenTeam);
    setCloudStatus();
    pollSync();
  } finally { cloud.syncing = false; }
}
function placeTeam(td, rid){
  // vervangt een leeg team met dezelfde naam, anders als nieuw team erbij
  const empty = S.teams.find(t => !cloudCfg(t.id) && teamLabel(t) === teamLabel(td) && !hasContent(t));
  const tid = empty ? empty.id : uid();
  const nt = {...td, id: tid};
  if (empty) S.teams[S.teams.indexOf(empty)] = nt; else S.teams.push(nt);
  const map = cloudMap(); map[tid] = {id: rid, v: 7}; setCloudMap(map);
  normalize();
  return tid;
}
async function saveUserTeams(){
  const teams = {}; Object.values(cloudMap()).forEach(c => { if (!isLegacy(c)) teams[c.id] = true; });
  await cloud.api.userSet(myUid(), {name: myName(), teams}).catch(e => console.error(e));
}
async function createRemoteTeam(t){
  const uid = myUid(), rid = randId(20);
  t.people = {[uid]: {name: myName() || 'Trainer', joined: Date.now()}};
  t.invites = []; delete t.members;
  await cloud.api.teamCreate(rid, {members: {[uid]: 'owner'}, data: JSON.stringify(t), version: DATA_VERSION, updated: Date.now(), by: DEVICE});
  const map = cloudMap(); map[t.id] = {id: rid, v: 7}; setCloudMap(map);
  return rid;
}
async function migrateLegacy(tid, c){
  const api = cloud.api, t = S.teams.find(x => x.id === tid);
  const remote = await api.get(c.id).catch(() => null);
  if (remote && remote.kind === 'moved' && remote.movedTo){
    // een andere trainer heeft dit team al overgezet: meedoen via zijn uitnodiging
    await joinRemote(remote.movedTo, remote.invite, tid);
    return;
  }
  const td = remote ? teamFromRemote(remote, t) : null;
  if (td && (remote.updated || 0) > 0){ const i = S.teams.indexOf(t); S.teams[i] = {...td, id: tid}; normalize(); }
  const tt = S.teams.find(x => x.id === tid);
  const rid = await createRemoteTeam(tt);
  // de trainers van de oude koppeling kunnen 60 dagen lang meedoen na inloggen
  const iid = randId(24);
  await api.inviteCreate(iid, {team: rid, multi: true, expires: new Date(Date.now() + 60 * 864e5), name: 'Trainers', teamLabel: teamLabel(tt), club: tt.club || '', byName: myName(), by: myUid(), created: Date.now(), usedBy: null});
  // oude, onbeveiligde opslag leegmaken: alleen een verwijzing blijft staan
  await api.set(c.id, {kind: 'moved', movedTo: rid, invite: iid, data: '{}', version: DATA_VERSION, updated: Date.now(), by: DEVICE});
}

// ---------- gegevens ontvangen en versturen ----------
function applyRemote(tid, r){
  const L = cloud.links[tid]; if (!L || !r) return;
  if ((r.version || 0) > DATA_VERSION){ cloud.outdated = true; setCloudStatus('old'); showOutdated(); return; }
  const mk = JSON.stringify(r.members || {}), memChanged = mk !== L.memKey;
  L.members = r.members || {}; L.memKey = mk;
  if (!L.members[myUid()]){ lostAccess(tid); return; }
  const fresh = r.by !== DEVICE && !L.timer && (r.updated || 0) > L.lastRemote;
  if (!fresh){ if (!L.timer) linkStatus(tid, 'ok'); afterRemote(tid); if (memChanged && tid === S.active.team) render(); return; }
  const local = S.teams.find(t => t.id === tid); if (!local) return;
  const td = teamFromRemote(r, local); if (!td) return;
  L.lastRemote = r.updated || 0;
  const apply = () => {
    const i = S.teams.findIndex(t => t.id === tid); if (i < 0) return;
    td.id = tid;
    S.teams[i] = td; normalize();
    L.last = JSON.stringify(S.teams[i]);
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    render(); linkStatus(tid, 'ok');
    afterRemote(tid);
  };
  const a = document.activeElement;
  if ((a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || drag.el || document.querySelector('.modal')) cloud.pending = apply;
  else apply();
}
function afterRemote(tid){
  // zorg dat je eigen naam in de lijst staat
  const t = S.teams.find(x => x.id === tid), uid = myUid(); if (!t || !uid) return;
  t.people = t.people || {};
  if (!t.people[uid] || (myName() && t.people[uid].name !== myName())){ t.people[uid] = {...(t.people[uid] || {joined: Date.now()}), name: myName() || 'Trainer'}; save(); }
}
function flushPending(){ if (cloud.pending && !drag.el && !document.querySelector('.modal')){ const f = cloud.pending; cloud.pending = null; f(); } }
document.addEventListener('focusout', () => setTimeout(flushPending, 50));
function cloudPush(){
  if (!cloud.api || !myUid()) return;
  Object.keys(cloud.links).forEach(tid => cloudPushTeam(tid, false));
  // nieuwe teams met inhoud automatisch online bewaren
  if (!cloud.syncing) S.teams.forEach(t => { if (!cloudCfg(t.id) && hasContent(t) && !cloud.creating.has(t.id)){ cloud.creating.add(t.id); createRemoteTeam(t).then(() => { saveUserTeams(); save(); listenTeam(t.id); }).catch(e => console.error(e)).finally(() => cloud.creating.delete(t.id)); } });
}
function cloudPushTeam(tid, now){
  const L = cloud.links[tid]; if (!L || !cloud.api || cloud.outdated) return;
  const t = S.teams.find(x => x.id === tid); if (!t) return;
  const json = JSON.stringify(t);
  if (!now && json === L.last) return;
  clearTimeout(L.timer); linkStatus(tid, 'busy');
  L.timer = setTimeout(async () => {
    L.timer = null;
    const tt = S.teams.find(x => x.id === tid); if (!tt) return;
    const data = JSON.stringify(tt), u = Date.now();
    try { await cloud.api.teamPush(L.id, {data, version: DATA_VERSION, updated: u, by: DEVICE}); L.last = data; L.lastRemote = Math.max(L.lastRemote, u); if (!L.timer) linkStatus(tid, 'ok'); }
    catch(e){ console.error(e); if (/permission/i.test(e.code || e.message || '')) lostAccess(tid); else linkStatus(tid, 'err'); }
  }, now ? 0 : 700);
}
function showOutdated(){
  if (document.getElementById('outdated')) return;

  d.innerHTML = iconize('⬆️ Er is een nieuwere versie van de app. Tik hier om te verversen.');

function loginDialog(intro){

    let mode = 'in';
    const draw = (msg = '', ok = false) => {
      const email = d.querySelector('#auMail')?.value || '', name = d.querySelector('#auName')?.value || myName();
      d.innerHTML = iconize(`<div class="box" style="max-height:90vh;overflow:auto"><p>👤 ${mode === 'up' ? 'Nieuw account maken' : 'Inloggen bij LineUp'}</p>
